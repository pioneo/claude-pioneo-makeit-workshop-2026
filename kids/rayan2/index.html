<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayan's Rocket League 2D 🚀</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;
    color:#fff;gap:.4rem;padding:.4rem;user-select:none}
  h1{font-size:clamp(1rem,3.5vw,1.5rem);font-weight:900;
    background:linear-gradient(135deg,#3b82f6,#f97316);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  canvas{border-radius:10px;border:2px solid rgba(255,255,255,0.08);
    box-shadow:0 0 60px rgba(59,130,246,.25),0 20px 60px rgba(0,0,0,.9);display:block}
  .hint{font-size:.65rem;color:#1e293b;letter-spacing:.06em}
</style>
</head>
<body>
<h1>🚀 Rayan's Rocket League 2D</h1>
<canvas id="c"></canvas>
<div class="hint">← → Fahren &nbsp;·&nbsp; ↑ Springen (2×) &nbsp;·&nbsp; Leertaste = Boost &nbsp;·&nbsp; Erster bei 5 Toren gewinnt!</div>
<script>
const W=700, H=460;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W; cv.height=H;

// ── Arena (SEITENANSICHT) ──────────────────────────────────────────
const UI_H=56;          // top UI bar height
const AT=UI_H;          // ceiling y = 56
const AB=440;           // floor y
const AL=32;            // left wall x
const AR=668;           // right wall x
const GOAL_H=120;       // goal opening height (from floor UP)
const GT=AB-GOAL_H;     // = 320  goal top y
const GB=AB;            // = 440  goal bottom y (= floor)
const GD=32;            // goal depth (how deep the net goes)

const BALL_R=18;
const CAR_W=52, CAR_H=22, WHL_R=10;
const GRAV=0.42;
// Car center y when wheels touch floor
const GROUND_Y=AB-WHL_R-CAR_H/2;   // = 440-10-11 = 419
const MAX_SCORE=5;

// ── State ──────────────────────────────────────────────────────────
let scene='menu';
let frameT=0, goalTimer=0, goalTeam='';
let scores={player:0,ai:0};
let parts=[];

// ── Ball ──────────────────────────────────────────────────────────
function ballReset(){
  return{x:W/2, y:AT+60, vx:(Math.random()<.5?1:-1)*(2+Math.random()*2), vy:-1};
}
let ball=ballReset();

// ── Car factory ───────────────────────────────────────────────────
function makeCar(team){
  return{x:team==='player'?W/3:2*W/3, y:GROUND_Y,
    vx:0, vy:0, onGround:true, jumps:0,
    boost:100, boosting:false,
    facing:team==='player'?1:-1, team, jumpEdge:false};
}
let player=makeCar('player');
let ai=makeCar('ai');

// ── Input ─────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>K[e.key]=false);

// ── Shared car physics ────────────────────────────────────────────
function applyPhysics(car){
  if(!car.onGround) car.vy+=GRAV;
  car.x+=car.vx; car.y+=car.vy;
  if(car.onGround) car.vx*=0.85; else car.vx*=0.995;
  car.vx=Math.max(-9,Math.min(9,car.vx));
  car.vy=Math.max(-15,Math.min(15,car.vy));

  // Floor
  if(car.y>=GROUND_Y){car.y=GROUND_Y;car.vy=0;car.onGround=true;car.jumps=0;}
  // Ceiling
  if(car.y-CAR_H/2<AT){car.y=AT+CAR_H/2;car.vy=Math.abs(car.vy)*.4;}
  // Walls (cars can't enter goal area)
  if(car.x-CAR_W/2<AL){car.x=AL+CAR_W/2;car.vx=Math.abs(car.vx)*.3;}
  if(car.x+CAR_W/2>AR){car.x=AR-CAR_W/2;car.vx=-Math.abs(car.vx)*.3;}
}

// ── Player update ─────────────────────────────────────────────────
function updatePlayer(){
  const acc=player.onGround?.5:.22;
  if(K['ArrowLeft']){player.vx=Math.max(-6,player.vx-acc);player.facing=-1;}
  if(K['ArrowRight']){player.vx=Math.min(6,player.vx+acc);player.facing=1;}

  const jNow=K['ArrowUp'];
  if(jNow&&!player.jumpEdge){
    if(player.onGround){player.vy=-10;player.onGround=false;player.jumps=1;}
    else if(player.jumps===1){player.vy=-9;player.jumps=2;}
  }
  player.jumpEdge=jNow;

  player.boosting=K[' ']&&player.boost>0;
  if(player.boosting){
    player.boost=Math.max(0,player.boost-1.8);
    player.vx+=player.facing*.95;
    player.vy-=.42;
    if(frameT%2===0)boostParticle(player);
  }else{
    player.boost=Math.min(100,player.boost+.35);
  }
  applyPhysics(player);
}

// ── AI update ─────────────────────────────────────────────────────
let aiJE=false;
function updateAI(){
  const dx=ball.x-ai.x, dy=ball.y-ai.y;
  const dist=Math.hypot(dx,dy);
  const dir=dx>0?1:-1;
  ai.facing=dir;
  const acc=ai.onGround?.45:.2;
  if(Math.abs(dx)>14) ai.vx=Math.max(-6,Math.min(6,ai.vx+dir*acc));
  else ai.vx*=ai.onGround?.82:.99;

  // Jump toward airborne ball
  const wJ=ball.y<ai.y-60&&dist<240;
  if(wJ&&!aiJE){
    if(ai.onGround){ai.vy=-10.5;ai.onGround=false;ai.jumps=1;}
    else if(ai.jumps===1&&Math.abs(dx)<130){ai.vy=-9;ai.jumps=2;}
  }
  aiJE=wJ;

  // Boost in air toward ball
  ai.boosting=!ai.onGround&&ai.boost>25&&dist<200;
  if(ai.boosting){
    ai.boost=Math.max(0,ai.boost-1.2);
    ai.vx+=dir*.6; ai.vy-=.28;
    if(frameT%2===0)boostParticle(ai);
  }else{
    ai.boost=Math.min(100,ai.boost+.4);
  }
  applyPhysics(ai);
}

// ── Ball physics ──────────────────────────────────────────────────
function updateBall(){
  ball.vy+=GRAV;
  ball.x+=ball.vx; ball.y+=ball.vy;
  ball.vx*=0.992;

  // Floor
  if(ball.y+BALL_R>=AB){
    ball.y=AB-BALL_R; ball.vy=-Math.abs(ball.vy)*.6;
    ball.vx*=.9;
    if(Math.abs(ball.vy)<.8)ball.vy=0;
  }
  // Ceiling
  if(ball.y-BALL_R<=AT){ball.y=AT+BALL_R;ball.vy=Math.abs(ball.vy)*.6;}

  // Left wall — only bounce if NOT in goal opening
  const inL=ball.y+BALL_R>GT&&ball.y-BALL_R<GB;
  if(ball.x-BALL_R<=AL&&!inL){ball.x=AL+BALL_R;ball.vx=Math.abs(ball.vx)*.72;}

  // Right wall
  const inR=ball.y+BALL_R>GT&&ball.y-BALL_R<GB;
  if(ball.x+BALL_R>=AR&&!inR){ball.x=AR-BALL_R;ball.vx=-Math.abs(ball.vx)*.72;}

  // ── GOAL DETECTION ──
  // Ball is deep inside left goal → AI scores
  if(ball.x-BALL_R<AL-GD&&ball.y+BALL_R>GT){goalScored('ai');return;}
  // Ball is deep inside right goal → Player scores
  if(ball.x+BALL_R>AR+GD&&ball.y+BALL_R>GT){goalScored('player');return;}
}

// ── Car–ball collision ────────────────────────────────────────────
function carBallCollision(car){
  const cx=Math.max(car.x-CAR_W/2,Math.min(car.x+CAR_W/2,ball.x));
  const cy=Math.max(car.y-CAR_H/2,Math.min(car.y+CAR_H/2,ball.y));
  const dx=ball.x-cx, dy=ball.y-cy, dist=Math.hypot(dx,dy);
  if(dist<BALL_R&&dist>.01){
    const nx=dx/dist, ny=dy/dist;
    ball.x+=nx*(BALL_R-dist+1); ball.y+=ny*(BALL_R-dist+1);
    const relV=(ball.vx-car.vx)*nx+(ball.vy-car.vy)*ny;
    if(relV<0){
      const imp=-(1+.82)*relV;
      ball.vx+=imp*nx; ball.vy+=imp*ny;
    }
    const spd=Math.hypot(ball.vx,ball.vy);
    if(spd>18){ball.vx*=18/spd;ball.vy*=18/spd;}
    for(let i=0;i<5;i++)parts.push({x:ball.x,y:ball.y,
      vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:22,col:'#fff',r:3});
  }
}

// ── Goal ─────────────────────────────────────────────────────────
function goalScored(team){
  if(scene!=='game')return;
  goalTeam=team; scores[team]++;
  scene='goal'; goalTimer=0;
  for(let i=0;i<50;i++){
    const a=Math.random()*Math.PI*2;
    parts.push({x:ball.x,y:ball.y,
      vx:Math.cos(a)*(2+Math.random()*6),vy:Math.sin(a)*(2+Math.random()*6),
      life:70,col:team==='player'?'#3b82f6':'#f97316',r:4+Math.random()*4});
  }
  if(scores[team]>=MAX_SCORE)setTimeout(()=>scene='win',1500);
}
function resetPositions(){ball=ballReset();player=makeCar('player');ai=makeCar('ai');parts=[];}

// ── Particles ────────────────────────────────────────────────────
function boostParticle(car){
  parts.push({x:car.x-car.facing*26,y:car.y+4,
    vx:-car.facing*(1.5+Math.random()*2),vy:(Math.random()-.5)*2.5,
    life:20,col:car.team==='player'?'#60a5fa':'#fb923c',r:4+Math.random()*3});
}

// ── Update ───────────────────────────────────────────────────────
function update(){
  frameT++;
  if(scene==='game'){
    updatePlayer(); updateAI();
    updateBall();
    carBallCollision(player); carBallCollision(ai);
  }
  if(scene==='goal'){
    goalTimer++;
    if(goalTimer===90&&scores[goalTeam]<MAX_SCORE){resetPositions();scene='game';}
  }
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0;});
}

// ── DRAW: Arena (side view) ───────────────────────────────────────
function drawArenaBg(){
  // Sky inside the arena (dark blue indoor stadium)
  const g=ctx.createLinearGradient(0,AT,0,AB);
  g.addColorStop(0,'#0c1320');
  g.addColorStop(.6,'#080e1a');
  g.addColorStop(1,'#050a12');
  ctx.fillStyle=g;
  ctx.fillRect(AL,AT,AR-AL,AB-AT);

  // Ceiling glow (stadium lights)
  const lg=ctx.createLinearGradient(0,AT,0,AT+60);
  lg.addColorStop(0,'rgba(120,160,255,.18)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg; ctx.fillRect(AL,AT,AR-AL,60);

  // Floor glow
  const fg=ctx.createLinearGradient(0,AB-30,0,AB);
  fg.addColorStop(0,'rgba(0,0,0,0)');
  fg.addColorStop(1,'rgba(59,130,246,.08)');
  ctx.fillStyle=fg; ctx.fillRect(AL,AB-30,AR-AL,30);

  // Center vertical line
  ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=2;
  ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(W/2,AT);ctx.lineTo(W/2,AB);ctx.stroke();
  ctx.setLineDash([]);

  // Corner marks (small arcs on floor near walls)
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(AL+4,AB,55,Math.PI*1.5,0);ctx.stroke();
  ctx.beginPath();ctx.arc(AR-4,AB,55,Math.PI,Math.PI*1.5);ctx.stroke();
}

function drawArenaWalls(){
  const wallCol='#1e293b';

  // LEFT wall: only top portion (above goal)
  ctx.fillStyle=wallCol;
  ctx.fillRect(0,AT,AL,GT-AT);
  // LEFT goal net interior
  ctx.fillStyle='rgba(59,130,246,.12)';
  ctx.fillRect(AL-GD,GT,GD,GB-GT);
  // net grid (blue)
  ctx.strokeStyle='rgba(59,130,246,.28)'; ctx.lineWidth=1;
  for(let y=GT;y<=AB;y+=16){ctx.beginPath();ctx.moveTo(AL-GD,y);ctx.lineTo(AL,y);ctx.stroke();}
  for(let x=AL-GD;x<=AL;x+=12){ctx.beginPath();ctx.moveTo(x,GT);ctx.lineTo(x,AB);ctx.stroke();}

  // RIGHT wall: only top portion (above goal)
  ctx.fillStyle=wallCol;
  ctx.fillRect(AR,AT,W-AR,GT-AT);
  // RIGHT goal net interior
  ctx.fillStyle='rgba(249,115,22,.12)';
  ctx.fillRect(AR,GT,GD,GB-GT);
  // net grid (orange)
  ctx.strokeStyle='rgba(249,115,22,.28)'; ctx.lineWidth=1;
  for(let y=GT;y<=AB;y+=16){ctx.beginPath();ctx.moveTo(AR,y);ctx.lineTo(AR+GD,y);ctx.stroke();}
  for(let x=AR;x<=AR+GD;x+=12){ctx.beginPath();ctx.moveTo(x,GT);ctx.lineTo(x,AB);ctx.stroke();}

  // Floor — solid bar
  ctx.fillStyle='#1e293b';
  ctx.fillRect(AL,AB,AR-AL,6);

  // Wall borders (the edge of the wall that's visible inside the arena)
  ctx.fillStyle='#2d3f55';
  ctx.fillRect(AL-2,AT,3,GT-AT+3); // left wall inner edge (top part)
  ctx.fillRect(AR-1,AT,3,GT-AT+3); // right wall inner edge (top part)

  // Ceiling bar
  ctx.fillStyle='#1e293b';
  ctx.fillRect(AL,AT,AR-AL,3);

  // Goal post (crossbar)
  ctx.fillStyle='#e2e8f0'; ctx.shadowColor='#fff'; ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(AL,GT,7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(AR,GT,7,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Black outside zones
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,AT);          // above ceiling → UI bar background
  ctx.fillRect(0,AB+6,W,H-AB-6);   // below floor
  // Left of field (outside wall — goal backing)
  ctx.fillRect(0,GT,AL-GD,AB-GT);  // left side, below goal top
  ctx.fillRect(0,AT,AL-GD,GT-AT+2);// left wall solid part bg
  // Right of field
  ctx.fillRect(AR+GD,GT,W-AR-GD,AB-GT);
  ctx.fillRect(AR+GD,AT,W-AR-GD,GT-AT+2);

  // Back walls of goals
  ctx.fillStyle='#111827';
  ctx.fillRect(0,GT,AL-GD+2,AB-GT+6);  // left goal back
  ctx.fillRect(AR+GD-2,GT,W-AR-GD+2,AB-GT+6); // right goal back
}

// ── DRAW: Car ─────────────────────────────────────────────────────
function drawCar(car){
  const x=car.x,y=car.y,f=car.facing;
  const col=car.team==='player'?'#3b82f6':'#f97316';
  const dark=car.team==='player'?'#1d4ed8':'#c2410c';

  // Floor shadow
  if(car.onGround){
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(x,AB+1,28,4,0,0,Math.PI*2);ctx.fill();
  }

  // Boost flame
  if(car.boosting){
    const gr=ctx.createRadialGradient(x-f*26,y+3,0,x-f*26,y+3,28);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.3,'rgba(255,220,50,.85)');
    gr.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.ellipse(x-f*26,y+3,28,10,0,0,Math.PI*2);ctx.fill();
  }

  // Wheels
  [x-16, x+16].forEach(wx=>{
    const wy=y+CAR_H/2+4;
    ctx.fillStyle='#0f172a';
    ctx.beginPath();ctx.arc(wx,wy,WHL_R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#374151';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(wx,wy,WHL_R*.55,0,Math.PI*2);ctx.stroke();
  });

  // Body
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.beginPath();ctx.roundRect(x-CAR_W/2,y-CAR_H/2,CAR_W,CAR_H,6);ctx.fill();
  ctx.shadowBlur=0;
  // Body highlight
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.beginPath();ctx.roundRect(x-CAR_W/2+4,y-CAR_H/2+3,CAR_W-8,7,3);ctx.fill();

  // Windshield
  ctx.fillStyle='rgba(186,230,253,.45)';
  const wX=f===1?x+1:x-23;
  ctx.beginPath();ctx.roundRect(wX,y-CAR_H/2+4,22,CAR_H-9,3);ctx.fill();

  // Spoiler
  ctx.fillStyle=dark;
  const sX=f===1?x-CAR_W/2-2:x+CAR_W/2-10;
  ctx.beginPath();ctx.roundRect(sX,y-CAR_H/2-7,12,8,2);ctx.fill();
  ctx.fillRect(sX+3,y-CAR_H/2-1,6,CAR_H/2+1);

  // Boost meter arc above car
  const ba=car.boost/100;
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(x,y-CAR_H/2-14,10,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=car.boost>50?'#facc15':car.boost>25?'#f97316':'#ef4444';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y-CAR_H/2-14,10,-Math.PI/2,-Math.PI/2+Math.PI*2*ba);ctx.stroke();
}

// ── DRAW: Ball ────────────────────────────────────────────────────
function drawBall(){
  const bx=ball.x,by=ball.y;
  // Shadow on floor (grows as ball falls)
  const sd=Math.max(0,Math.min(1,(by-AT)/(AB-AT)));
  ctx.fillStyle=`rgba(0,0,0,${sd*.5})`;
  ctx.beginPath();ctx.ellipse(bx,AB+1,BALL_R*(1-sd*.3),4,0,0,Math.PI*2);ctx.fill();

  // Ball
  const bg=ctx.createRadialGradient(bx-5,by-5,2,bx,by,BALL_R);
  bg.addColorStop(0,'#f8fafc'); bg.addColorStop(.6,'#cbd5e1'); bg.addColorStop(1,'#64748b');
  ctx.fillStyle=bg; ctx.shadowColor='rgba(255,255,255,.5)'; ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(bx,by,BALL_R,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Spin lines
  ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1.5;
  const rot=frameT*.05;
  for(let i=0;i<6;i++){
    const a=rot+i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(bx+Math.cos(a)*BALL_R*.4,by+Math.sin(a)*BALL_R*.4);
    ctx.lineTo(bx+Math.cos(a)*BALL_R*.88,by+Math.sin(a)*BALL_R*.88);
    ctx.stroke();
  }
}

// ── DRAW: Particles ───────────────────────────────────────────────
function drawParts(){
  parts.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/60);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(0,p.life/60),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── DRAW: UI bar ──────────────────────────────────────────────────
function drawUI(){
  ctx.fillStyle='rgba(0,0,0,.88)'; ctx.fillRect(0,0,W,UI_H-2);

  // Player (blue)
  ctx.fillStyle='#3b82f6'; ctx.font='bold 13px Segoe UI'; ctx.textAlign='left';
  ctx.fillText('🔵 Rayan',10,20);
  ctx.fillStyle='#374151'; ctx.font='9px Segoe UI'; ctx.fillText('BOOST',10,33);
  ctx.fillStyle='rgba(255,255,255,.1)'; ctx.beginPath();ctx.roundRect(10,37,92,8,4);ctx.fill();
  if(player.boost>0){
    ctx.fillStyle=player.boost>50?'#facc15':player.boost>25?'#f97316':'#ef4444';
    ctx.beginPath();ctx.roundRect(10,37,92*(player.boost/100),8,4);ctx.fill();
  }

  // AI (orange)
  ctx.fillStyle='#f97316'; ctx.font='bold 13px Segoe UI'; ctx.textAlign='right';
  ctx.fillText('🟠 KI',W-10,20);
  ctx.fillStyle='#374151'; ctx.font='9px Segoe UI'; ctx.fillText('BOOST',W-10,33);
  ctx.fillStyle='rgba(255,255,255,.1)'; ctx.beginPath();ctx.roundRect(W-102,37,92,8,4);ctx.fill();
  if(ai.boost>0){
    ctx.fillStyle=ai.boost>50?'#facc15':ai.boost>25?'#f97316':'#ef4444';
    ctx.beginPath();ctx.roundRect(W-102,37,92*(ai.boost/100),8,4);ctx.fill();
  }

  // Scores
  ctx.textAlign='center';
  ctx.fillStyle='#3b82f6'; ctx.font='bold 26px Segoe UI'; ctx.fillText(scores.player,W/2-30,40);
  ctx.fillStyle='#475569'; ctx.font='18px Segoe UI'; ctx.fillText('–',W/2,38);
  ctx.fillStyle='#f97316'; ctx.font='bold 26px Segoe UI'; ctx.fillText(scores.ai,W/2+30,40);
  ctx.fillStyle='#1e293b'; ctx.font='9px Segoe UI'; ctx.fillText('ERSTE BEI '+MAX_SCORE,W/2,52);
}

// ── DRAW: Goal overlay ────────────────────────────────────────────
function drawGoalOverlay(){
  const t=Math.min(1,goalTimer/25);
  ctx.fillStyle=`rgba(0,0,0,${t*.6})`; ctx.fillRect(0,0,W,H);
  const col=goalTeam==='player'?'#3b82f6':'#f97316';
  const pulse=1+Math.sin(goalTimer*.2)*.04;
  ctx.save();ctx.translate(W/2,(AT+AB)/2);ctx.scale(pulse,pulse);
  ctx.font='bold 38px Segoe UI'; ctx.fillStyle=col;
  ctx.shadowColor=col; ctx.shadowBlur=40; ctx.textAlign='center';
  ctx.fillText(goalTeam==='player'?'⚽ TOR! Rayan punktet!':'⚽ TOR! KI punktet!',0,0);
  ctx.shadowBlur=0;
  ctx.font='18px Segoe UI'; ctx.fillStyle='#94a3b8';
  ctx.fillText(`${scores.player}  –  ${scores.ai}`,0,36);
  ctx.restore();
}

// ── DRAW: Menu ────────────────────────────────────────────────────
function drawMenu(){
  ctx.fillStyle='#060c18'; ctx.fillRect(0,0,W,H);
  // Stars
  for(let i=0;i<80;i++){
    ctx.fillStyle=`rgba(255,255,255,${.2+Math.sin(frameT*.04+i)*.18})`;
    ctx.beginPath();ctx.arc((i*173)%W,(i*97)%H,1.2,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='center';
  ctx.font='52px Segoe UI'; ctx.shadowColor='#3b82f6'; ctx.shadowBlur=24;
  ctx.fillText('🚀',W/2,100); ctx.shadowBlur=0;
  ctx.font='bold 26px Segoe UI';
  const tg=ctx.createLinearGradient(W/2-160,0,W/2+160,0);
  tg.addColorStop(0,'#3b82f6'); tg.addColorStop(.5,'#93c5fd'); tg.addColorStop(1,'#f97316');
  ctx.fillStyle=tg; ctx.fillText("Rayan's Rocket League 2D",W/2,148);
  ctx.font='11px Segoe UI'; ctx.fillStyle='#64748b';
  ctx.fillText('Schieße den Ball in das orangene Tor!',W/2,172);

  ctx.fillStyle='rgba(255,255,255,.04)'; ctx.beginPath();ctx.roundRect(W/2-200,188,400,96,12);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W/2-200,188,400,96,12);ctx.stroke();
  [['← →','Fahren (auch in der Luft)'],['↑','Springen — nochmal ↑ für Doppelsprung'],['Leertaste','Boost 🔥 (Meter lädt automatisch)']].forEach(([k,v],i)=>{
    ctx.fillStyle='#93c5fd'; ctx.font='bold 12px Segoe UI'; ctx.textAlign='right';
    ctx.fillText(k,W/2-18,213+i*24);
    ctx.fillStyle='#94a3b8'; ctx.font='12px Segoe UI'; ctx.textAlign='left';
    ctx.fillText(v,W/2-10,213+i*24);
  });

  const p=Math.sin(frameT*.07)*5;
  ctx.fillStyle='rgba(59,130,246,.18)'; ctx.beginPath();ctx.roundRect(W/2-120,300+p,240,52,14);ctx.fill();
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.beginPath();ctx.roundRect(W/2-120,300+p,240,52,14);ctx.stroke();
  ctx.font='bold 16px Segoe UI'; ctx.fillStyle='#93c5fd'; ctx.textAlign='center';
  ctx.fillText('🚀  Spiel starten!',W/2,332+p);
  ctx.font='10px Segoe UI'; ctx.fillStyle='#1e293b';
  ctx.fillText('Erster bei '+MAX_SCORE+' Toren gewinnt!',W/2,390);

  cv.onclick=()=>{resetPositions();scores={player:0,ai:0};scene='game';cv.onclick=null;};
}

// ── DRAW: Win ────────────────────────────────────────────────────
function drawWin(){
  ctx.fillStyle='#060c18'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<100;i++){
    const x=(i*137+frameT*.8)%W, y=(i*97+frameT*.3)%H;
    ctx.fillStyle=['#3b82f6','#f97316','#fff','#facc15'][i%4];
    ctx.globalAlpha=.6; ctx.beginPath();ctx.arc(x,y,2+Math.sin(i)*1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  const winner=scores.player>=MAX_SCORE;
  const col=winner?'#3b82f6':'#f97316';
  ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='60px Segoe UI'; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(winner?'🏆':'🤖',W/2,110); ctx.shadowBlur=0;
  ctx.font='bold 24px Segoe UI'; ctx.fillStyle=col;
  ctx.fillText(winner?'🔵 Rayan gewinnt!':'🟠 KI gewinnt!',W/2,162);
  ctx.font='40px Segoe UI'; ctx.fillStyle='#fff';
  ctx.fillText(`${scores.player} – ${scores.ai}`,W/2,215);
  ctx.font='13px Segoe UI'; ctx.fillStyle='#94a3b8';
  ctx.fillText(winner?'Hammer! Du bist ein Rocket-League-Profi! 🎉':'Knapp! Versuch es nochmal!',W/2,256);

  const p=Math.sin(frameT*.07)*4;
  ctx.fillStyle='rgba(59,130,246,.15)'; ctx.beginPath();ctx.roundRect(W/2-110,288+p,220,48,12);ctx.fill();
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.beginPath();ctx.roundRect(W/2-110,288+p,220,48,12);ctx.stroke();
  ctx.font='bold 14px Segoe UI'; ctx.fillStyle='#93c5fd';
  ctx.fillText('🔄 Nochmal spielen',W/2,318+p);
  cv.onclick=()=>{cv.onclick=null;resetPositions();scores={player:0,ai:0};scene='menu';};
}

// ── Main loop ────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  frameT++;
  ctx.clearRect(0,0,W,H);
  update();

  if(scene==='menu'){drawMenu();return;}
  if(scene==='win'){drawWin();return;}

  drawArenaBg();
  drawParts();
  drawCar(ai); drawCar(player);
  drawBall();
  drawArenaWalls();  // draw walls ON TOP so cars/ball don't "leak" outside
  drawUI();
  if(scene==='goal')drawGoalOverlay();
}
loop();
</script>
