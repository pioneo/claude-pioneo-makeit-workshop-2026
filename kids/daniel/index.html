<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniels Allgemeinwissen-Quiz 🧠</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29 0%, #1a1050 50%, #0f0c29 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff; padding: 1rem;
    }

    /* Floating stars */
    .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: var(--a); } to { opacity: calc(var(--a) * 3); } }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 2rem 2rem 1.5rem;
      max-width: 600px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
    }

    /* Header */
    .header { text-align: center; margin-bottom: 1.5rem; }
    .brain { font-size: 2.8rem; margin-bottom: 0.3rem; animation: bob 2.5s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    h1 {
      font-size: clamp(1.3rem, 4vw, 1.8rem); font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(167,139,250,0.4));
    }
    .subtitle { color: #64748b; font-size: 0.78rem; margin-top: 0.2rem; letter-spacing: 0.06em; }

    /* Progress */
    .progress-wrap { margin-bottom: 1.2rem; }
    .progress-info {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; color: #64748b; margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .progress-bar {
      height: 7px; background: rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 10px;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(167,139,250,0.5);
    }

    /* Category badge */
    .cat-badge {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.1em; padding: 0.2rem 0.7rem;
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 20px; color: #a78bfa;
      margin-bottom: 0.7rem;
    }

    /* Question */
    .question {
      font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 700;
      line-height: 1.45; margin-bottom: 1.3rem; color: #e2e8f0;
      min-height: 3.5rem;
    }

    /* Answers */
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1.2rem; }
    .ans {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 0.75rem 0.8rem;
      font-size: 0.9rem; font-weight: 600; color: #cbd5e1;
      cursor: pointer; transition: all 0.14s; text-align: left;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .ans:hover:not(:disabled) {
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.4);
      color: #fff; transform: translateY(-1px);
    }
    .ans .letter {
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      background: rgba(255,255,255,0.08); font-size: 0.75rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; color: #94a3b8;
    }
    .ans.correct { background: rgba(74,222,128,0.15); border-color: #4ade80; color: #4ade80; }
    .ans.correct .letter { background: rgba(74,222,128,0.2); color: #4ade80; }
    .ans.wrong   { background: rgba(248,113,113,0.15); border-color: #f87171; color: #f87171; }
    .ans.wrong .letter { background: rgba(248,113,113,0.2); color: #f87171; }
    .ans:disabled { cursor: default; transform: none; }

    /* Feedback */
    .feedback {
      min-height: 2.8rem; font-size: 0.88rem; font-weight: 600;
      line-height: 1.5; color: #94a3b8; margin-bottom: 0.8rem;
      padding: 0.6rem 0.9rem;
      background: rgba(255,255,255,0.04); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s;
    }
    .feedback.correct { color: #4ade80; border-color: rgba(74,222,128,0.2); background: rgba(74,222,128,0.06); }
    .feedback.wrong   { color: #f87171; border-color: rgba(248,113,113,0.2); background: rgba(248,113,113,0.06); }

    /* Score */
    .score-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; color: #475569;
    }
    .score-badge {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 20px; padding: 0.25rem 0.8rem;
      font-weight: 800; color: #a78bfa; font-size: 0.85rem;
    }

    /* Result screen */
    .result { display: none; text-align: center; }
    .result.show { display: block; }
    .result-emoji { font-size: 4rem; margin-bottom: 0.5rem; }
    .result-title {
      font-size: 1.7rem; font-weight: 900; margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .result-score {
      font-size: 3rem; font-weight: 900; color: #a78bfa;
      text-shadow: 0 0 20px rgba(167,139,250,0.5);
      margin: 0.3rem 0;
    }
    .result-msg { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.6; }

    /* Category breakdown */
    .breakdown { text-align: left; margin-bottom: 1.3rem; }
    .breakdown-title { font-size: 0.7rem; color: #475569; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .cat-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; font-size: 0.78rem; }
    .cat-row .cat-name { width: 120px; color: #94a3b8; }
    .cat-row .cat-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .cat-row .cat-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#a78bfa,#38bdf8); }
    .cat-row .cat-score { width: 32px; text-align: right; color: #64748b; font-size: 0.7rem; }

    .btn-restart {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff; border: none; border-radius: 14px;
      padding: 0.85rem 2.2rem; font-size: 1rem; font-weight: 800;
      cursor: pointer; letter-spacing: 0.04em;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(124,58,237,0.5); }

    .quiz-section { }
    .quiz-section.hidden { display: none; }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
  <!-- Quiz -->
  <div class="quiz-section" id="quizSection">
    <div class="header">
      <div class="brain">🧠</div>
      <h1>Daniels Allgemeinwissen</h1>
      <p class="subtitle">QUIZ · 12 FRAGEN · 4 KATEGORIEN</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="qCounter">Frage 1 / 12</span>
        <span id="scoreDisplay">0 Punkte</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="cat-badge" id="catBadge">🌍 Geografie</div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="score-row">
      <span id="streakInfo"></span>
      <span class="score-badge" id="scoreBadge">0 ⭐</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result" id="result">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Fantastisch!</div>
    <div class="result-score" id="resultScore">12 / 12</div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="breakdown" id="breakdown"></div>
    <button class="btn-restart" onclick="startQuiz()">🔄 Nochmal spielen</button>
  </div>
</div>

<script>
// ── Stars ──
const starsEl = document.getElementById('stars');
for(let i=0;i<80;i++) {
  const s = document.createElement('div');
  const sz = Math.random()*2+0.5;
  s.className='star';
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;
    --d:${2+Math.random()*4}s;--a:${0.05+Math.random()*0.15};animation-delay:${Math.random()*4}s`;
  starsEl.appendChild(s);
}

// ── Questions ──
const QUESTIONS = [
  // Geografie
  { cat:'🌍 Geografie', q:'Was ist die Hauptstadt von Australien?', a:['Sydney','Melbourne','Canberra','Brisbane'], c:2, ex:'Canberra ist die Hauptstadt, nicht Sydney!' },
  { cat:'🌍 Geografie', q:'Welcher Fluss ist der längste der Welt?', a:['Amazonas','Nil','Mississippi','Yangtze'], c:1, ex:'Der Nil in Afrika ist mit ~6.650 km der längste Fluss.' },
  { cat:'🌍 Geografie', q:'Auf welchem Kontinent liegt Ägypten?', a:['Asien','Europa','Afrika','Südamerika'], c:2, ex:'Ägypten liegt in Nordafrika.' },
  // Wissenschaft
  { cat:'🔬 Wissenschaft', q:'Was ist H₂O?', a:['Sauerstoff','Wasserstoff','Wasser','Kohlendioxid'], c:2, ex:'H₂O ist die chemische Formel für Wasser (2 Wasserstoff + 1 Sauerstoff).' },
  { cat:'🔬 Wissenschaft', q:'Welcher Planet ist der größte im Sonnensystem?', a:['Saturn','Uranus','Neptune','Jupiter'], c:3, ex:'Jupiter ist der größte Planet – er ist größer als alle anderen Planeten zusammen!' },
  { cat:'🔬 Wissenschaft', q:'Was macht ein Herbivore?', a:['Frisst Fleisch','Frisst Pflanzen','Frisst alles','Trinkt nur Wasser'], c:1, ex:'Herbivoren sind Pflanzenfresser, wie zum Beispiel Kühe oder Kaninchen.' },
  // Geschichte
  { cat:'📜 Geschichte', q:'In welchem Jahr fiel die Berliner Mauer?', a:['1987','1989','1991','1993'], c:1, ex:'Die Berliner Mauer fiel am 9. November 1989.' },
  { cat:'📜 Geschichte', q:'Wer war der erste Mensch auf dem Mond?', a:['Buzz Aldrin','Yuri Gagarin','Neil Armstrong','John Glenn'], c:2, ex:'Neil Armstrong betrat am 20. Juli 1969 als erster Mensch den Mond.' },
  { cat:'📜 Geschichte', q:'Wer war der erste Präsident der USA?', a:['Abraham Lincoln','Thomas Jefferson','George Washington','John Adams'], c:2, ex:'George Washington war von 1789 bis 1797 der erste Präsident der USA.' },
  // Natur & Tiere
  { cat:'🦁 Natur & Tiere', q:'Wie viele Herzen hat ein Oktopus?', a:['1','2','3','4'], c:2, ex:'Ein Oktopus hat 3 Herzen: 2 für die Kiemen, 1 für den Körper.' },
  { cat:'🦁 Natur & Tiere', q:'Was ist das schnellste Landtier?', a:['Löwe','Gepard','Pferd','Strauß'], c:1, ex:'Der Gepard kann bis zu 120 km/h erreichen – das schnellste Landtier!' },
  { cat:'🦁 Natur & Tiere', q:'Wie lange trägt ein Elefant ihr Junges?', a:['6 Monate','12 Monate','18 Monate','22 Monate'], c:3, ex:'Elefanten haben mit ~22 Monaten die längste Tragzeit aller Landsäugetiere.' },
];

let questions, qIdx, score, streak, catScores, answered;

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a;
}

function startQuiz() {
  questions = shuffle(QUESTIONS);
  qIdx=0; score=0; streak=0;
  catScores={};
  QUESTIONS.forEach(q=>{ if(!catScores[q.cat]) catScores[q.cat]={right:0,total:0}; });
  document.getElementById('result').classList.remove('show');
  document.getElementById('quizSection').classList.remove('hidden');
  document.getElementById('scoreBadge').textContent='0 ⭐';
  showQuestion();
}

function showQuestion() {
  const q = questions[qIdx];
  answered = false;

  document.getElementById('qCounter').textContent = `Frage ${qIdx+1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(qIdx/questions.length)*100}%`;
  document.getElementById('catBadge').textContent = q.cat;
  document.getElementById('question').textContent = q.q;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('streakInfo').textContent = streak >= 2 ? `🔥 ${streak}er Streak!` : '';

  const letters = ['A','B','C','D'];
  const container = document.getElementById('answers');
  container.innerHTML = '';
  q.a.forEach((txt, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans';
    btn.innerHTML = `<span class="letter">${letters[i]}</span>${txt}`;
    btn.onclick = () => handleAnswer(i, btn, q);
    container.appendChild(btn);
  });
}

function handleAnswer(idx, btn, q) {
  if(answered) return;
  answered = true;
  const allBtns = document.querySelectorAll('.ans');
  allBtns.forEach(b=>b.disabled=true);
  allBtns[q.c].classList.add('correct');

  const fb = document.getElementById('feedback');
  catScores[q.cat].total++;

  if(idx===q.c) {
    score++; streak++;
    btn.classList.add('correct');
    fb.textContent = `✅ Richtig! ${q.ex}`;
    fb.className = 'feedback correct';
    catScores[q.cat].right++;
  } else {
    streak=0;
    btn.classList.add('wrong');
    fb.textContent = `❌ Leider falsch! ${q.ex}`;
    fb.className = 'feedback wrong';
  }

  document.getElementById('scoreDisplay').textContent = `${score} Punkte`;
  document.getElementById('scoreBadge').textContent = `${score} ⭐`;
  document.getElementById('streakInfo').textContent = streak>=2?`🔥 ${streak}er Streak!`:'';

  setTimeout(()=>{
    qIdx++;
    qIdx < questions.length ? showQuestion() : showResult();
  }, 1600);
}

function showResult() {
  document.getElementById('quizSection').classList.add('hidden');
  const res = document.getElementById('result');
  res.classList.add('show');

  const total = questions.length;
  document.getElementById('resultScore').textContent = `${score} / ${total}`;

  let emoji, title, msg;
  const pct = score/total;
  if(pct===1)        { emoji='🏆'; title='PERFEKT!';     msg='Unglaublich! Du weißt wirklich alles. Ein echtes Genie!'; }
  else if(pct>=0.83) { emoji='⭐'; title='Fantastisch!'; msg='Fast perfekt! Du bist ein Allgemeinwissen-Champion.'; }
  else if(pct>=0.66) { emoji='👍'; title='Sehr gut!';   msg='Starkes Ergebnis! Du kennst dich in vielen Bereichen aus.'; }
  else if(pct>=0.5)  { emoji='🙂'; title='Gut gemacht!'; msg='Solide! Mit ein bisschen mehr Übung schaffst du noch mehr.'; }
  else               { emoji='📚'; title='Weitermachen!';msg='Das Wissen kommt mit der Zeit. Versuch es nochmal!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;

  // Category breakdown
  const bd = document.getElementById('breakdown');
  const cats = Object.entries(catScores).filter(([,v])=>v.total>0);
  if(cats.length>0) {
    bd.innerHTML = `<div class="breakdown-title">KATEGORIEN</div>` +
      cats.map(([cat,v])=>`
        <div class="cat-row">
          <span class="cat-name">${cat}</span>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${v.total?v.right/v.total*100:0}%"></div></div>
          <span class="cat-score">${v.right}/${v.total}</span>
        </div>`).join('');
  }
}

startQuiz();
</script>
</body>
</html>
