<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Snake 🐍</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1040;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      padding: 0.8rem;
      overflow: hidden;
      user-select: none;
    }

    /* Animated star background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(90,40,180,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(30,60,160,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(20,10,60,1) 0%, transparent 100%);
      z-index: -1;
    }

    /* Title */
    .title {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #FFD600;
      -webkit-text-stroke: 3px #7B3800;
      text-shadow: 0 4px 0 #7B3800, 0 6px 10px rgba(0,0,0,0.5);
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }

    /* HUD */
    .hud {
      display: flex; gap: 0.8rem; margin-bottom: 0.8rem;
      align-items: stretch;
    }
    .hud-box {
      display: flex; align-items: center; gap: 0.4rem;
      background: linear-gradient(180deg, #2e1f6e 0%, #1a1040 100%);
      border: 3px solid #4a2fa0;
      border-radius: 14px;
      padding: 0.35rem 0.9rem;
      box-shadow: 0 4px 0 #120b30, 0 6px 16px rgba(0,0,0,0.4);
    }
    .hud-icon { font-size: 1.3rem; }
    .hud-text { display: flex; flex-direction: column; }
    .hud-label {
      font-size: 0.55rem; color: #7a6aaa;
      letter-spacing: 0.1em; line-height: 1;
    }
    .hud-value {
      font-size: 1.25rem; color: #FFD600;
      -webkit-text-stroke: 1.5px #7B3800;
      text-shadow: 0 2px 0 #7B3800;
      line-height: 1;
    }
    #bestVal { color: #ff9d00; }

    /* Arena wrapper */
    .arena-wrap {
      position: relative;
      border-radius: 18px;
      border: 5px solid #4a2fa0;
      box-shadow:
        0 0 0 3px #120b30,
        0 8px 0 #120b30,
        0 10px 30px rgba(0,0,0,0.7),
        inset 0 0 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    canvas { display: block; }

    /* Overlay */
    .overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.8rem;
      background: rgba(10, 6, 40, 0.82);
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }

    .ov-icon { font-size: 4rem; animation: bounce 1s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

    .ov-title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #FFD600;
      -webkit-text-stroke: 3px #7B3800;
      text-shadow: 0 4px 0 #7B3800;
    }
    .ov-sub {
      font-size: 0.8rem; color: #9d8de0;
      text-align: center; line-height: 1.6;
      font-family: 'Segoe UI', sans-serif; font-weight: 700;
    }

    /* Brawl Stars style button */
    .btn-brawl {
      position: relative;
      background: linear-gradient(180deg, #FFE033 0%, #FF9500 100%);
      border: none; border-radius: 16px;
      padding: 0.75rem 2.2rem;
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 1.15rem; color: #fff;
      -webkit-text-stroke: 1.5px #7B3800;
      text-shadow: 0 2px 0 #7B3800;
      cursor: pointer; pointer-events: all;
      box-shadow: 0 6px 0 #c45e00, 0 8px 16px rgba(0,0,0,0.4);
      transition: transform 0.08s, box-shadow 0.08s;
      letter-spacing: 0.03em;
    }
    .btn-brawl:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c45e00, 0 10px 20px rgba(0,0,0,0.5); }
    .btn-brawl:active { transform: translateY(4px); box-shadow: 0 2px 0 #c45e00; }

    /* Particles */
    .particle {
      position: fixed; pointer-events: none; z-index: 999;
      font-size: 1.2rem; animation: pfx 0.8s ease-out forwards;
    }
    @keyframes pfx {
      0%   { opacity:1; transform: translate(0,0) scale(1.2); }
      100% { opacity:0; transform: translate(var(--dx),var(--dy)) scale(0.3) rotate(var(--rot)); }
    }
  </style>
</head>
<body>

<div class="title">🐍 BRAWL SNAKE</div>

<div class="hud">
  <div class="hud-box">
    <div class="hud-icon">💎</div>
    <div class="hud-text">
      <div class="hud-label">GEMS</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
  </div>
  <div class="hud-box">
    <div class="hud-icon">⚡</div>
    <div class="hud-text">
      <div class="hud-label">POWER</div>
      <div class="hud-value" id="levelVal">1</div>
    </div>
  </div>
  <div class="hud-box">
    <div class="hud-icon">🏆</div>
    <div class="hud-text">
      <div class="hud-label">RECORD</div>
      <div class="hud-value" id="bestVal">0</div>
    </div>
  </div>
</div>

<div class="arena-wrap">
  <canvas id="c"></canvas>
  <div class="overlay" id="overlay">
    <div class="ov-icon">🐍</div>
    <div class="ov-title" id="ovTitle">BRAWL SNAKE</div>
    <div class="ov-sub" id="ovSub">Sammel 💎 Gems ein!<br>Pfeiltasten zum Steuern</div>
    <button class="btn-brawl" id="ovBtn">▶ BRAWLEN!</button>
  </div>
</div>

<script>
// ── Config ──
const COLS = 22, ROWS = 22, CELL = 24;
const W = COLS * CELL, H = ROWS * CELL;
const SPEEDS = [160, 138, 118, 100, 84, 70];

// Brawl Stars palette
const COL = {
  tile1:  '#1e154a',
  tile2:  '#221859',
  wall:   '#2e1f6e',
  snake1: '#00C8FF',
  snake2: '#0060C0',
  outline:'#003880',
  gem:    '#CC44FF',
  gemGlow:'#9900CC',
  star:   '#FFD600',
  starGlow:'#FF9500',
  danger: '#FF3D3D',
};

// Canvas
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

// ── State ──
let snake, dir, nextDir, gem, bonus, score, level, best, running, loopId;
best = 0;

function init() {
  const mx = Math.floor(COLS/2), my = Math.floor(ROWS/2);
  snake = [{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my},{x:mx-3,y:my}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  gem = rnd(); bonus = null;
  score = 0; level = 1; running = true;
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('levelVal').textContent = 1;
  scheduleBonus();
}

function rnd() {
  let p;
  do { p = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  return p;
}

let bonusTimer = null;
function scheduleBonus() {
  if(bonusTimer) clearTimeout(bonusTimer);
  bonusTimer = setTimeout(()=>{
    if(!running) return;
    bonus = rnd();
    bonusTimer = setTimeout(()=>{ bonus=null; scheduleBonus(); }, 5000);
  }, 7000 + Math.random()*5000);
}

// ── Loop ──
let lastTick = 0;
function loop(ts) {
  if(!running) return;
  loopId = requestAnimationFrame(loop);
  const spd = SPEEDS[Math.min(level-1, SPEEDS.length-1)];
  if(ts - lastTick < spd) { draw(); return; }
  lastTick = ts; tick(); draw();
}

function tick() {
  dir = {...nextDir};
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { gameOver(); return; }
  if(snake.some(s=>s.x===head.x&&s.y===head.y)) { gameOver(); return; }
  snake.unshift(head);

  if(head.x===gem.x && head.y===gem.y) {
    score += 10; gem = rnd();
    level = Math.min(6, 1+Math.floor(score/60));
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('levelVal').textContent = level;
    burst(head, ['💎','✨','💜','⚡']);
  } else if(bonus && head.x===bonus.x && head.y===bonus.y) {
    score += 30; bonus = null; scheduleBonus();
    document.getElementById('scoreVal').textContent = score;
    burst(head, ['⭐','🏆','💛','✨','🔥']);
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  cancelAnimationFrame(loopId);
  if(bonusTimer) clearTimeout(bonusTimer);
  if(score > best) { best = score; document.getElementById('bestVal').textContent = best; }
  draw();
  document.getElementById('ovTitle').textContent = '💀 RAUS!';
  document.getElementById('ovSub').innerHTML =
    `Du hast <span style="color:#FFD600">${score} Gems</span> gesammelt!<br>Länge: ${snake.length} · Power ${level}`;
  document.getElementById('ovBtn').textContent = '🔄 NOCHMAL!';
  document.getElementById('overlay').classList.remove('hidden');
}

// ── Draw ──
function draw() {
  // Arena tiles (checkerboard)
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) {
    ctx.fillStyle = (x+y)%2===0 ? COL.tile1 : COL.tile2;
    ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
  }

  // Border glow
  ctx.strokeStyle = COL.wall;
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W-4, H-4);

  // Gem
  drawPickup(gem.x, gem.y, COL.gem, COL.gemGlow, '💎');
  if(bonus) drawPickup(bonus.x, bonus.y, COL.star, COL.starGlow, '⭐');

  // Snake body
  for(let i = snake.length-1; i >= 0; i--) {
    drawSegment(snake[i], i, snake.length);
  }
}

function drawSegment(seg, i, total) {
  const isHead = i === 0;
  const t = i / Math.max(total-1, 1);

  // Color gradient: bright blue → darker blue
  const r = Math.round(lerp(0,   0,   t));
  const g = Math.round(lerp(200, 80,  t));
  const b = Math.round(lerp(255, 180, t));
  const col = `rgb(${r},${g},${b})`;

  const pad = 2;
  const x = seg.x*CELL+pad, y = seg.y*CELL+pad;
  const s = CELL-pad*2;
  const rad = isHead ? 8 : 6;

  // Outline (dark blue)
  ctx.fillStyle = COL.outline;
  roundRect(ctx, x-2, y-2, s+4, s+4, rad+2); ctx.fill();

  // Body
  ctx.fillStyle = col;
  roundRect(ctx, x, y, s, s, rad); ctx.fill();

  // Shine on top half
  const shine = ctx.createLinearGradient(x, y, x, y+s*0.5);
  shine.addColorStop(0, 'rgba(255,255,255,0.28)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  roundRect(ctx, x, y, s, s*0.5, rad); ctx.fill();

  if(isHead) {
    // Glow
    ctx.shadowColor = '#00C8FF'; ctx.shadowBlur = 14;
    ctx.fillStyle = col;
    roundRect(ctx, x, y, s, s, rad); ctx.fill();
    ctx.shadowBlur = 0;

    // Eyes
    const ex = seg.x*CELL + CELL/2;
    const ey = seg.y*CELL + CELL/2;
    const eo = 4.5;
    // White sclera
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex+dir.y*eo+dir.x*3, ey+dir.x*eo+dir.y*3, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex-dir.y*eo+dir.x*3, ey-dir.x*eo+dir.y*3, 3.2, 0, Math.PI*2); ctx.fill();
    // Pupils
    ctx.fillStyle = '#0a0a20';
    ctx.beginPath(); ctx.arc(ex+dir.y*eo+dir.x*4, ey+dir.x*eo+dir.y*4, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex-dir.y*eo+dir.x*4, ey-dir.x*eo+dir.y*4, 1.8, 0, Math.PI*2); ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex+dir.y*eo+dir.x*3.5, ey+dir.x*eo+dir.y*3.5, 0.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex-dir.y*eo+dir.x*3.5, ey-dir.x*eo+dir.y*3.5, 0.8, 0, Math.PI*2); ctx.fill();
  }
}

function drawPickup(px, py, color, glow, emoji) {
  const cx = px*CELL+CELL/2, cy = py*CELL+CELL/2;
  const r = CELL*0.36;

  // Glow ring
  ctx.shadowColor = glow; ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Outline
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(cx - r*0.25, cy - r*0.25, r*0.4, 0, Math.PI*2); ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function lerp(a,b,t) { return a+(b-a)*t; }

// ── Particle burst ──
function burst(cell, emojis) {
  const rect = cv.getBoundingClientRect();
  const bx = rect.left + (cell.x+0.5)*CELL*(rect.width/W);
  const by = rect.top  + (cell.y+0.5)*CELL*(rect.height/H);
  for(let i=0;i<14;i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const a = Math.random()*2*Math.PI;
    const d = 60 + Math.random()*100;
    el.style.setProperty('--dx', `${Math.cos(a)*d}px`);
    el.style.setProperty('--dy', `${Math.sin(a)*d}px`);
    el.style.setProperty('--rot', `${Math.random()*360}deg`);
    el.style.left = bx + 'px';
    el.style.top  = by + 'px';
    el.style.animationDelay = `${Math.random()*0.15}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

// ── Input ──
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp':    if(dir.y===0) nextDir={x:0,y:-1}; e.preventDefault(); break;
    case 'ArrowDown':  if(dir.y===0) nextDir={x:0,y:1};  e.preventDefault(); break;
    case 'ArrowLeft':  if(dir.x===0) nextDir={x:-1,y:0}; e.preventDefault(); break;
    case 'ArrowRight': if(dir.x===0) nextDir={x:1,y:0};  e.preventDefault(); break;
  }
});

// ── Start ──
document.getElementById('ovBtn').onclick = () => {
  document.getElementById('overlay').classList.add('hidden');
  init();
  lastTick = 0;
  requestAnimationFrame(loop);
};

draw();
</script>
</body>
</html>
