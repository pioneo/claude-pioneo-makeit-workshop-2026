<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Catch – Make-it Saar 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 1rem;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; letter-spacing: 2px; color: #e94560; }
    #scoreboard {
      display: flex;
      gap: 2rem;
      font-size: 1.1rem;
      margin-top: .4rem;
      color: #aaa;
    }
    #scoreboard span { color: #fff; font-weight: bold; }

    #arena {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    .item {
      position: absolute;
      font-size: 2.4rem;
      cursor: pointer;
      transition: transform .1s;
      animation: fall linear forwards;
    }
    .item:active { transform: scale(1.4); }

    @keyframes fall {
      from { top: -60px; }
      to   { top: 110%; }
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.7);
      font-size: 1.4rem;
      gap: 1.2rem;
      text-align: center;
      padding: 2rem;
    }
    #message h2 { font-size: 2rem; color: #e94560; }
    #message button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: .7rem 2.2rem;
      border-radius: 2rem;
      font-size: 1.1rem;
      cursor: pointer;
    }
    #message button:hover { background: #c73652; }

    #lives-bar {
      font-size: 1.4rem;
      letter-spacing: 4px;
      padding: .3rem 0;
    }
  </style>
</head>
<body>

<header>
  <h1>EMOJI CATCH</h1>
  <div id="scoreboard">
    Punkte: <span id="score">0</span>
    &nbsp;|&nbsp;
    Level: <span id="level">1</span>
  </div>
  <div id="lives-bar">❤️❤️❤️</div>
</header>

<div id="arena">
  <div id="message">
    <h2>Emoji Catch!</h2>
    <p>Fange die <strong>guten Emojis</strong> 😄🌟🍕🚀🐶<br>
       Vermeide die <strong>bösen</strong> 💀☠️👾🔥</p>
    <button onclick="startGame()">Spielen!</button>
  </div>
</div>

<script>
  const arena    = document.getElementById('arena');
  const scoreEl  = document.getElementById('score');
  const levelEl  = document.getElementById('level');
  const livesEl  = document.getElementById('lives-bar');
  const msgEl    = document.getElementById('message');

  const GOOD = ['😄','🌟','🍕','🚀','🐶','🍦','🎈','🦄','🍩','🎉','🐱','🌈'];
  const BAD  = ['💀','☠️','👾','🔥','🤡'];

  let score, lives, level, speed, spawnInterval, active;

  function startGame() {
    score = 0; lives = 3; level = 1; speed = 3500; active = true;
    updateHUD();
    msgEl.style.display = 'none';
    // clear old items
    arena.querySelectorAll('.item').forEach(el => el.remove());
    clearInterval(spawnInterval);
    spawnInterval = setInterval(spawnItem, 800);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = '❤️'.repeat(lives) || '';
  }

  function spawnItem() {
    if (!active) return;
    const isGood = Math.random() > 0.3;
    const pool   = isGood ? GOOD : BAD;
    const emoji  = pool[Math.floor(Math.random() * pool.length)];

    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = emoji;
    el.style.left = (Math.random() * (arena.offsetWidth - 60)) + 'px';
    el.style.animationDuration = speed + 'ms';

    el.addEventListener('click', () => {
      if (!active) return;
      el.remove();
      if (isGood) {
        score += 10;
        showPop(el, '+10', '#4ade80');
      } else {
        loseLife();
        showPop(el, '-1 ❤️', '#e94560');
      }
      updateHUD();
      checkLevel();
    });

    el.addEventListener('animationend', () => {
      if (!el.isConnected) return;
      el.remove();
      if (isGood) {
        loseLife();
        updateHUD();
      }
    });

    arena.appendChild(el);
  }

  function loseLife() {
    lives--;
    if (lives <= 0) gameOver();
  }

  function checkLevel() {
    const nextLevel = Math.floor(score / 100) + 1;
    if (nextLevel > level) {
      level = nextLevel;
      speed = Math.max(1200, 3500 - (level - 1) * 300);
    }
  }

  function gameOver() {
    active = false;
    clearInterval(spawnInterval);
    arena.querySelectorAll('.item').forEach(el => el.remove());
    msgEl.innerHTML = `
      <h2>Game Over!</h2>
      <p>Du hast <strong>${score} Punkte</strong> erreicht!</p>
      <p style="color:#aaa;font-size:.95rem">Level ${level} geschafft</p>
      <button onclick="startGame()">Nochmal!</button>
    `;
    msgEl.style.display = 'flex';
  }

  function showPop(ref, text, color) {
    const pop = document.createElement('div');
    pop.textContent = text;
    pop.style.cssText = `
      position:absolute;
      left:${ref.style.left};
      top:${ref.style.top || '30%'};
      color:${color};
      font-size:1.4rem;
      font-weight:bold;
      pointer-events:none;
      animation: popfly .7s ease forwards;
      z-index:10;
    `;
    arena.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  // inject pop animation
  const style = document.createElement('style');
  style.textContent = `@keyframes popfly {
    from { opacity:1; transform:translateY(0) scale(1); }
    to   { opacity:0; transform:translateY(-60px) scale(1.4); }
  }`;
  document.head.appendChild(style);
</script>
</body>
</html>
