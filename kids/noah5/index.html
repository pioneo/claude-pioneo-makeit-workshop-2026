<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>🏎️ Auto Rennen!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Arial Black', Arial, sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      border: 4px solid #e94560;
      border-radius: 8px;
      box-shadow: 0 0 40px #e9456088;
    }
    #ui {
      color: white;
      font-size: 22px;
      margin-bottom: 10px;
      display: flex;
      gap: 40px;
    }
    #ui span { text-shadow: 0 0 10px #e94560; }
    #controls {
      color: #aaa;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <span>🏁 Punkte: <span id="score">0</span></span>
    <span>❤️ Leben: <span id="lives">3</span></span>
    <span>⚡ Level: <span id="level">1</span></span>
  </div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="controls">← → oder A D zum Lenken | SPACE zum Starten</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- Spielzustand ---
    let state = 'start'; // start, playing, dead, gameover
    let score = 0;
    let lives = 3;
    let level = 1;
    let frameCount = 0;
    let roadSpeed = 4;
    let invincible = 0; // Frames der Unverwundbarkeit nach Crash

    // --- Straße ---
    const ROAD_LEFT = 60;
    const ROAD_RIGHT = 340;
    const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
    const LANE_W = ROAD_WIDTH / 3;
    const LANES = [
      ROAD_LEFT + LANE_W * 0.5,
      ROAD_LEFT + LANE_W * 1.5,
      ROAD_LEFT + LANE_W * 2.5,
    ];

    // Fahrbahn-Markierungen (gestrichelte Linien)
    let roadLines = [];
    for (let i = 0; i < 12; i++) {
      roadLines.push({ y: i * 70 });
    }

    // --- Spieler Auto ---
    const player = {
      x: LANES[1],
      y: 490,
      w: 36,
      h: 60,
      lane: 1,
      targetX: LANES[1],
      color: '#e94560',
      bodyColor: '#ff6b6b',
    };

    // --- Gegner Autos ---
    let enemies = [];
    const ENEMY_COLORS = ['#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#dda0dd','#98fb98','#f0e68c'];

    // --- Explosions-Partikel ---
    let particles = [];

    // --- Münzen ---
    let coins = [];

    // --- Hintergrund (Bäume/Gebäude) ---
    let bgObjects = [];
    for (let i = 0; i < 8; i++) {
      bgObjects.push({
        x: Math.random() < 0.5 ? Math.random() * 50 + 5 : Math.random() * 50 + 345,
        y: Math.random() * 600,
        type: Math.floor(Math.random() * 3),
        size: 20 + Math.random() * 20,
      });
    }

    // Tastatur
    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if ((e.code === 'Space' || e.code === 'Enter') && state === 'start') startGame();
      if ((e.code === 'Space' || e.code === 'Enter') && state === 'gameover') resetGame();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch für Mobile
    let touchStartX = null;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      if (state === 'start' || state === 'gameover') { startGame(); resetGame(); }
    });
    canvas.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 30) {
        if (dx < 0 && player.lane > 0) player.lane--;
        if (dx > 0 && player.lane < 2) player.lane++;
        player.targetX = LANES[player.lane];
      }
      touchStartX = null;
    });

    function startGame() {
      state = 'playing';
    }

    function resetGame() {
      score = 0; lives = 3; level = 1; frameCount = 0;
      roadSpeed = 4; enemies = []; particles = []; coins = [];
      player.lane = 1; player.targetX = LANES[1]; player.x = LANES[1];
      invincible = 0;
      updateUI();
      state = 'playing';
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('level').textContent = level;
    }

    // --- Eingabe verarbeiten ---
    let moveCooldown = 0;
    function handleInput() {
      if (moveCooldown > 0) { moveCooldown--; return; }
      if (keys['ArrowLeft'] || keys['KeyA']) {
        if (player.lane > 0) { player.lane--; player.targetX = LANES[player.lane]; moveCooldown = 12; }
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        if (player.lane < 2) { player.lane++; player.targetX = LANES[player.lane]; moveCooldown = 12; }
      }
    }

    // --- Gegner spawnen ---
    function spawnEnemy() {
      const lane = Math.floor(Math.random() * 3);
      enemies.push({
        x: LANES[lane],
        y: -80,
        w: 34,
        h: 58,
        lane,
        speed: roadSpeed * (0.8 + Math.random() * 0.6),
        color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)],
      });
    }

    // --- Münze spawnen ---
    function spawnCoin() {
      const lane = Math.floor(Math.random() * 3);
      coins.push({ x: LANES[lane], y: -20, lane });
    }

    // --- Kollision ---
    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax - aw/2 < bx + bw/2 && ax + aw/2 > bx - bw/2 &&
             ay - ah/2 < by + bh/2 && ay + ah/2 > by - bh/2;
    }

    // --- Partikel ---
    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 40 + Math.floor(Math.random() * 20),
          maxLife: 60,
          color,
          size: 4 + Math.random() * 6,
        });
      }
    }

    // --- Update ---
    function update() {
      if (state !== 'playing') return;
      frameCount++;
      if (invincible > 0) invincible--;

      // Spieler bewegen
      handleInput();
      player.x += (player.targetX - player.x) * 0.18;

      // Straßen-Level und Geschwindigkeit
      score += 1;
      level = 1 + Math.floor(score / 500);
      roadSpeed = 4 + (level - 1) * 0.8;
      updateUI();

      // Straßenlinien
      roadLines.forEach(l => {
        l.y += roadSpeed;
        if (l.y > 650) l.y -= 12 * 70;
      });

      // Hintergrundobjekte
      bgObjects.forEach(o => {
        o.y += roadSpeed * 0.7;
        if (o.y > 650) { o.y = -40; o.x = Math.random() < 0.5 ? Math.random() * 50 + 5 : Math.random() * 50 + 345; }
      });

      // Gegner spawnen
      const spawnRate = Math.max(35, 90 - level * 8);
      if (frameCount % spawnRate === 0) spawnEnemy();
      if (frameCount % 120 === 0) spawnCoin();

      // Gegner update
      enemies.forEach(e => e.y += e.speed);
      enemies = enemies.filter(e => e.y < 700);

      // Münzen update
      coins.forEach(c => c.y += roadSpeed * 0.9);
      // Münzen einsammeln
      coins = coins.filter(c => {
        if (rectsOverlap(player.x, player.y, player.w, player.h, c.x, c.y, 20, 20)) {
          score += 50; updateUI();
          spawnExplosion(c.x, c.y, '#FFD700');
          return false;
        }
        return c.y < 700;
      });

      // Kollision Gegner
      if (invincible === 0) {
        enemies.forEach(e => {
          if (rectsOverlap(player.x, player.y, player.w - 6, player.h - 6, e.x, e.y, e.w - 6, e.h - 6)) {
            spawnExplosion(player.x, player.y, '#e94560');
            lives--;
            updateUI();
            invincible = 90;
            if (lives <= 0) {
              spawnExplosion(player.x, player.y, '#ff0000');
              setTimeout(() => { state = 'gameover'; }, 800);
            }
          }
        });
      }

      // Partikel update
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.95; p.vy *= 0.95;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    // --- Zeichnen ---
    function drawCar(x, y, w, h, color, isPlayer) {
      ctx.save();
      ctx.translate(x, y);

      // Karosserie
      ctx.fillStyle = color;
      roundRect(ctx, -w/2, -h/2, w, h, 8);
      ctx.fill();

      // Dach
      ctx.fillStyle = isPlayer ? '#c0392b' : '#2c3e50';
      roundRect(ctx, -w/2 + 5, -h/2 + 12, w - 10, h - 28, 5);
      ctx.fill();

      // Fenster
      ctx.fillStyle = isPlayer ? '#85c1e9aa' : '#85c1e9aa';
      roundRect(ctx, -w/2 + 7, -h/2 + 14, w - 14, 14, 3);
      ctx.fill();
      roundRect(ctx, -w/2 + 7, h/2 - 28, w - 14, 10, 3);
      ctx.fill();

      // Räder
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(-w/2 - 4, -h/2 + 8, 8, 14);
      ctx.fillRect(w/2 - 4, -h/2 + 8, 8, 14);
      ctx.fillRect(-w/2 - 4, h/2 - 22, 8, 14);
      ctx.fillRect(w/2 - 4, h/2 - 22, 8, 14);

      // Scheinwerfer
      if (isPlayer) {
        ctx.fillStyle = '#fffacd';
        ctx.fillRect(-w/2 + 4, -h/2 + 2, 8, 6);
        ctx.fillRect(w/2 - 12, -h/2 + 2, 8, 6);
      } else {
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(-w/2 + 4, h/2 - 8, 8, 5);
        ctx.fillRect(w/2 - 12, h/2 - 8, 8, 5);
      }

      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawTree(x, y, size) {
      ctx.fillStyle = '#2d5a1b';
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size * 0.6, y + size * 0.3);
      ctx.lineTo(x - size * 0.6, y + size * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a7c3f';
      ctx.beginPath();
      ctx.moveTo(x, y - size * 1.2);
      ctx.lineTo(x + size * 0.4, y - size * 0.1);
      ctx.lineTo(x - size * 0.4, y - size * 0.1);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#6b4226';
      ctx.fillRect(x - size * 0.1, y + size * 0.3, size * 0.2, size * 0.4);
    }

    function draw() {
      // Hintergrund
      ctx.fillStyle = '#2d5016';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hintergrundobjekte
      bgObjects.forEach(o => drawTree(o.x, o.y, o.size));

      // Straße
      ctx.fillStyle = '#555566';
      ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, canvas.height);

      // Straßenrand
      ctx.fillStyle = '#ffff00';
      ctx.fillRect(ROAD_LEFT, 0, 5, canvas.height);
      ctx.fillRect(ROAD_RIGHT - 5, 0, 5, canvas.height);

      // Spurlinien
      ctx.strokeStyle = '#ffffff88';
      ctx.setLineDash([40, 30]);
      ctx.lineWidth = 3;
      roadLines.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(ROAD_LEFT + LANE_W, l.y - 700);
        ctx.lineTo(ROAD_LEFT + LANE_W, l.y + 700);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ROAD_LEFT + LANE_W * 2, l.y - 700);
        ctx.lineTo(ROAD_LEFT + LANE_W * 2, l.y + 700);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // Münzen
      coins.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#FFA500';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 0);
        ctx.restore();
      });

      // Gegner
      enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, false));

      // Spieler (blinkt bei Unverwundbarkeit)
      if (invincible === 0 || Math.floor(frameCount / 5) % 2 === 0) {
        drawCar(player.x, player.y, player.w, player.h, player.color, true);
      }

      // Partikel
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Start-Screen
      if (state === 'start') {
        ctx.fillStyle = '#000000aa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 48px Arial Black';
        ctx.textAlign = 'center';
        ctx.fillText('🏎️', canvas.width/2, 200);
        ctx.fillText('AUTO', canvas.width/2, 260);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('RENNEN!', canvas.width/2, 320);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 22px Arial';
        ctx.fillText('← → zum Lenken', canvas.width/2, 390);
        ctx.fillStyle = '#aaffaa';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('SPACE drücken zum Starten!', canvas.width/2, 440);
      }

      // Game Over
      if (state === 'gameover') {
        ctx.fillStyle = '#000000bb';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 52px Arial Black';
        ctx.textAlign = 'center';
        ctx.fillText('CRASH! 💥', canvas.width/2, 220);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('Punkte: ' + score, canvas.width/2, 290);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('SPACE zum Nochmal spielen', canvas.width/2, 360);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
