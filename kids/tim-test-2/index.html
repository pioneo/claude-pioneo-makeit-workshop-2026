<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Vogel – Make-it Saar 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    #hint {
      color: #fff;
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div id="hint">Klick oder Leertaste</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Konstanten ───────────────────────────────────────────────────────────────
const GRAVITY    = 0.5;
const JUMP       = -9.5;
const PIPE_SPD   = 2.8;
const PIPE_GAP   = 155;
const PIPE_DIST  = 230;
const GROUND_H   = 60;
const BIRD_X     = 80;
const PIPE_W     = 52;

// ── Zustand ──────────────────────────────────────────────────────────────────
let state = 'idle';   // idle | play | dead
let score = 0, best = 0;
let bird, pipes, tick;

function reset() {
  bird  = { y: H / 2 - 20, vy: 0, angle: 0 };
  pipes = [];
  tick  = 0;
  score = 0;
}

function flap() {
  if (state === 'dead')  { state = 'idle'; reset(); return; }
  if (state === 'idle')  { state = 'play'; }
  bird.vy = JUMP;
}

canvas.addEventListener('pointerdown', flap);
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});

// ── Rohre ────────────────────────────────────────────────────────────────────
function addPipe() {
  const minY = 70, maxY = H - GROUND_H - PIPE_GAP - 70;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + 30, topH, scored: false });
}

// ── Kollision ────────────────────────────────────────────────────────────────
function hit() {
  const r = 13;
  if (bird.y + r >= H - GROUND_H) return true;
  if (bird.y - r <= 0)            return true;
  for (const p of pipes) {
    if (BIRD_X + r > p.x && BIRD_X - r < p.x + PIPE_W) {
      if (bird.y - r < p.topH || bird.y + r > p.topH + PIPE_GAP) return true;
    }
  }
  return false;
}

// ── Zeichnen ─────────────────────────────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  g.addColorStop(0, '#87CEEB');
  g.addColorStop(1, '#c9eaf5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [[50,55,26],[170,85,20],[280,48,30],[90,155,16],[240,130,22]].forEach(([cx,cy,r]) => {
    const x = ((cx - tick * 0.25) % (W + 80) + W + 80) % (W + 80) - 40;
    cloud(x, cy, r);
  });
}

function cloud(x, y, r) {
  ctx.beginPath();
  ctx.arc(x,         y,       r,        0, Math.PI*2);
  ctx.arc(x + r,     y-r*0.4, r * 0.75, 0, Math.PI*2);
  ctx.arc(x + r*1.8, y,       r * 0.6,  0, Math.PI*2);
  ctx.fill();
}

function drawGround() {
  const off = (tick * 1.5 % 40 + 40) % 40;
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#5DBB3F';
  ctx.fillRect(0, H - GROUND_H, W, 14);
  ctx.fillStyle = '#4aaa30';
  for (let x = -off; x < W + 10; x += 10) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H + 14);
    ctx.lineTo(x + 4, H - GROUND_H);
    ctx.lineTo(x + 8, H - GROUND_H + 14);
    ctx.fill();
  }
}

function drawPipe(p) {
  const lip = 8, lipH = 14;
  const bot = p.topH + PIPE_GAP;

  // oberes Rohr
  ctx.fillStyle = '#3aaa35';
  ctx.fillRect(p.x + lip, 0, PIPE_W - lip*2, p.topH - lipH);
  ctx.fillStyle = '#4dcc47';
  ctx.fillRect(p.x, p.topH - lipH, PIPE_W, lipH);
  ctx.fillStyle = '#2a8228';
  ctx.fillRect(p.x + PIPE_W - lip, 0, lip*0.5, p.topH - lipH);

  // unteres Rohr
  ctx.fillStyle = '#3aaa35';
  ctx.fillRect(p.x + lip, bot + lipH, PIPE_W - lip*2, H - bot - lipH);
  ctx.fillStyle = '#4dcc47';
  ctx.fillRect(p.x, bot, PIPE_W, lipH);
  ctx.fillStyle = '#2a8228';
  ctx.fillRect(p.x + PIPE_W - lip, bot + lipH, lip*0.5, H - bot - lipH);
}

function drawBird() {
  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  ctx.rotate(bird.angle);

  // Körper
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // Flügel
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(-4, 5, 10, 6, -0.4, 0, Math.PI*2);
  ctx.fill();

  // Augenweiß
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -4, 6, 0, Math.PI*2);
  ctx.fill();

  // Pupille
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(10, -4, 3, 0, Math.PI*2);
  ctx.fill();

  // Schnabel
  ctx.fillStyle = '#FF8C00';
  ctx.beginPath();
  ctx.moveTo(16, -1);
  ctx.lineTo(25, 2);
  ctx.lineTo(16, 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 42px Segoe UI';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#333';
  ctx.strokeText(score, W/2, 70);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, W/2, 70);
}

function drawPanel(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);

  const bw=260, bh=180, bx=(W-bw)/2, by=(H-bh)/2-20, r=16;
  ctx.fillStyle = '#fff8e7';
  roundRect(bx, by, bw, bh, r);
  ctx.fill();
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#222';
  ctx.font = 'bold 34px Segoe UI';
  ctx.fillText(title, W/2, by+52);

  ctx.font = '17px Segoe UI';
  ctx.fillStyle = '#555';
  ctx.fillText(sub, W/2, by+90);

  if (best > 0) {
    ctx.font = 'bold 15px Segoe UI';
    ctx.fillStyle = '#888';
    ctx.fillText(`Bester: ${best}`, W/2, by+120);
  }

  ctx.font = '14px Segoe UI';
  ctx.fillStyle = '#aaa';
  ctx.fillText('Klick oder Leertaste', W/2, by+150);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── Spielschleife ─────────────────────────────────────────────────────────────
reset();

(function loop() {
  requestAnimationFrame(loop);
  tick++;

  if (state === 'play') {
    bird.vy    += GRAVITY;
    bird.y     += bird.vy;
    bird.angle  = Math.min(Math.max(bird.vy * 0.06, -0.5), 1.2);

    // Rohre spawnen
    if (!pipes.length || pipes[pipes.length-1].x < W - PIPE_DIST) addPipe();

    // Rohre bewegen & punkte zählen
    for (const p of pipes) {
      p.x -= PIPE_SPD;
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true;
        score++;
        if (score > best) best = score;
      }
    }
    pipes = pipes.filter(p => p.x > -100);

    if (hit()) state = 'dead';
  }

  // ── Zeichnen ──
  drawSky();
  drawClouds();
  pipes.forEach(drawPipe);
  drawGround();
  drawBird();
  if (state !== 'idle') drawScore();
  if (state === 'idle') drawPanel('Flappy Vogel 🐦', 'Tippe zum Starten!');
  if (state === 'dead') drawPanel('Autsch! 💥',      `Punkte: ${score}`);
})();
</script>
</body>
</html>
