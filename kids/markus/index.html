<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markus – Mars Mission 🚀</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0018;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 15%, rgba(200,60,0,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 50% 35% at 80% 80%, rgba(80,0,200,0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ff7043, #ffab40, #ff7043);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(255,112,67,0.5));
      margin-bottom: 0.3rem;
      text-align: center;
    }

    .subtitle { color: #9e9e9e; font-size: 0.8rem; margin-bottom: 0.8rem; letter-spacing: 0.08em; text-align: center; }

    /* HUD */
    .hud {
      display: flex; gap: 1rem; margin-bottom: 0.6rem;
      font-size: 0.85rem; font-weight: 700;
    }
    .hud-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,112,67,0.3);
      border-radius: 10px;
      padding: 0.35rem 0.9rem;
      text-align: center;
    }
    .hud-label { font-size: 0.62rem; color: #9e9e9e; letter-spacing: 0.1em; text-transform: uppercase; }
    .hud-val { font-size: 1.1rem; color: #ff7043; }
    .hud-lives span { font-size: 1.1rem; }

    /* Canvas */
    .canvas-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255,112,67,0.35);
      box-shadow: 0 0 40px rgba(255,80,0,0.18), 0 20px 60px rgba(0,0,0,0.7);
    }
    canvas { display: block; }

    /* Overlay */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
      background: rgba(11,0,24,0.88);
      backdrop-filter: blur(10px);
    }
    .overlay.hidden { display: none; }
    .ov-icon { font-size: 3.5rem; filter: drop-shadow(0 0 14px rgba(255,112,67,0.8)); }
    .ov-title {
      font-size: 1.7rem; font-weight: 900; letter-spacing: 0.03em;
      background: linear-gradient(135deg, #ff7043, #ffab40);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .ov-msg { color: #9e9e9e; font-size: 0.88rem; text-align: center; max-width: 260px; line-height: 1.5; }
    .ov-score { color: #ffab40; font-weight: 700; font-size: 1rem; }
    .btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #e64a19, #ff7043);
      color: white; border: none; border-radius: 50px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      font-family: inherit; letter-spacing: 0.04em;
      box-shadow: 0 4px 20px rgba(255,112,67,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,112,67,0.55); }

    .controls-hint {
      color: #555; font-size: 0.72rem; margin-top: 0.6rem; text-align: center; letter-spacing: 0.04em;
    }
    .key {
      display: inline-block;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.7rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<h1>🚀 Mars Mission</h1>
<p class="subtitle">von Markus · Sammle alle Raketenteile!</p>

<div class="hud">
  <div class="hud-box">
    <div class="hud-label">Teile</div>
    <div class="hud-val" id="parts">0 / 8</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Leben</div>
    <div class="hud-val hud-lives" id="lives">❤️❤️❤️</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Level</div>
    <div class="hud-val" id="level">1</div>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="canvas"></canvas>

  <div class="overlay" id="overlay">
    <div class="ov-icon" id="ovIcon">🚀</div>
    <div class="ov-title" id="ovTitle">MARS MISSION</div>
    <div class="ov-msg" id="ovMsg">Hilf Astronaut Markus, alle Raketenteile einzusammeln – aber pass auf die grünen Aliens auf!</div>
    <div class="ov-score" id="ovScore" style="display:none"></div>
    <button class="btn" id="btnStart" onclick="startGame()">🚀 Mission starten</button>
  </div>
</div>

<div class="controls-hint">
  <span class="key">↑↓←→</span> oder <span class="key">WASD</span> bewegen
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const W = 520, H = 480;
canvas.width = W; canvas.height = H;

// ── Constants ──
const TILE   = 40;
const COLS   = W / TILE;  // 13
const ROWS   = H / TILE;  // 12
const TOTAL_PARTS = 8;

// ── Game state ──
let player, aliens, parts, rocks, craters;
let lives, collected, level, gameRunning, invincible, invTimer;
let particles = [];
let keys = {};

// ── Mars terrain ──
function buildTerrain() {
  rocks   = [];
  craters = [];
  // Static rocks (avoid player spawn zone center)
  const rockPositions = [
    {x:1,y:1},{x:3,y:2},{x:7,y:1},{x:10,y:2},{x:11,y:4},
    {x:2,y:5},{x:5,y:6},{x:8,y:5},{x:1,y:8},{x:4,y:9},
    {x:9,y:8},{x:11,y:9},{x:3,y:10},{x:7,y:10},{x:12,y:7},
    {x:0,y:3},{x:6,y:3},{x:10,y:11}
  ];
  rocks = rockPositions.filter(r => !(r.x>=5&&r.x<=7&&r.y>=4&&r.y<=7));

  for (let i=0;i<7;i++) {
    craters.push({
      x: (1+Math.random()*10.5)*TILE,
      y: (1+Math.random()*9.5)*TILE,
      r: 12+Math.random()*14
    });
  }
}

function isSolid(tx, ty) {
  return rocks.some(r=>r.x===tx&&r.y===ty);
}

function isClear(tx, ty) {
  if (tx<0||tx>=COLS||ty<0||ty>=ROWS) return false;
  return !isSolid(tx,ty);
}

// ── Parts placement – gleichmäßig über Zonen verteilt ──
function placeParts() {
  // Spielfeld in 8 Zonen aufteilen (2x4-Raster), pro Zone 1 Teil
  const zones = [
    {x1:0,y1:0,  x2:5,y2:5},   // oben-links
    {x1:6,y1:0,  x2:12,y2:5},  // oben-rechts
    {x1:0,y1:6,  x2:5,y2:11},  // unten-links
    {x1:6,y1:6,  x2:12,y2:11}, // unten-rechts
    {x1:0,y1:2,  x2:3,y2:9},   // links-mitte
    {x1:9,y1:2,  x2:12,y2:9},  // rechts-mitte
    {x1:3,y1:0,  x2:9,y2:3},   // oben-mitte
    {x1:3,y1:9,  x2:9,y2:11},  // unten-mitte
  ];

  parts = [];
  zones.forEach(z => {
    const candidates = [];
    for (let x=z.x1;x<=z.x2;x++) for (let y=z.y1;y<=z.y2;y++) {
      // Freihalten: Spieler-Startzone und Mindestabstand zu bereits platzierten Teilen
      if (isSolid(x,y)) continue;
      if (x>=5&&x<=7&&y>=4&&y<=7) continue;
      const tooClose = parts.some(p => Math.hypot(p.gx-x, p.gy-y) < 3);
      if (!tooClose) candidates.push({x,y});
    }
    if (candidates.length === 0) return;
    const p = candidates[Math.floor(Math.random()*candidates.length)];
    parts.push({gx:p.x, gy:p.y, x:p.x*TILE+TILE/2, y:p.y*TILE+TILE/2, collected:false, bob:Math.random()*Math.PI*2});
  });
}

// ── Aliens ──
function spawnAliens(count) {
  aliens = [];
  const spawnZones = [
    {x:0,y:0},{x:12,y:0},{x:0,y:11},{x:12,y:11},
    {x:0,y:5},{x:12,y:5},{x:6,y:0},{x:6,y:11}
  ];
  shuffle(spawnZones);
  for (let i=0;i<count;i++) {
    const s = spawnZones[i % spawnZones.length];
    let gx=s.x, gy=s.y;
    if(isSolid(gx,gy)) { gx=Math.min(COLS-1,gx+1); }
    aliens.push({
      x: gx*TILE+TILE/2, y: gy*TILE+TILE/2,
      gx, gy,
      speed: 0.5+level*0.15,
      dir: {x:0,y:1},
      moveTimer: 0,
      moveCooldown: 80 - level*6,  // langsamer, mehr Pausen
      wobble: Math.random()*Math.PI*2,
      type: (level >= 2 && i%3===1) ? 1 : 0  // Chaser erst ab Level 2, seltener
    });
  }
}

// ── Player ──
function spawnPlayer() {
  player = {
    x:6*TILE+TILE/2, y:6*TILE+TILE/2,
    speed: 2.2,
    facing: {x:0,y:-1},
    bobT: 0
  };
}

// ── Init ──
function startGame(lvl=1) {
  level = lvl;
  lives = 3;
  collected = 0;
  gameRunning = true;
  invincible = false; invTimer = 0;
  particles = [];
  keys = {};

  buildTerrain();
  placeParts();
  spawnPlayer();
  spawnAliens(2 + level);

  updateHUD();
  document.getElementById('overlay').classList.add('hidden');
  requestAnimationFrame(loop);
}

function nextLevel() {
  level++;
  collected = 0;
  particles = [];
  buildTerrain();
  placeParts();
  spawnPlayer();
  spawnAliens(2 + level);
  updateHUD();
  requestAnimationFrame(loop);
}

// ── HUD ──
function updateHUD() {
  document.getElementById('parts').textContent = collected + ' / ' + TOTAL_PARTS;
  document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
  document.getElementById('level').textContent = level;
}

// ── Game loop ──
let lastTime = 0;
function loop(ts) {
  if (!gameRunning) return;
  const dt = Math.min(ts - lastTime, 32);
  lastTime = ts;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── Update ──
function update(dt) {
  movePlayer(dt);
  moveAliens(dt);
  checkPartPickup();
  checkAlienCollision();
  updateParticles();

  if (invincible) {
    invTimer -= dt;
    if (invTimer <= 0) invincible = false;
  }
}

function movePlayer(dt) {
  let dx=0, dy=0;
  if (keys['ArrowUp']||keys['w']||keys['W'])    dy=-1;
  if (keys['ArrowDown']||keys['s']||keys['S'])   dy=1;
  if (keys['ArrowLeft']||keys['a']||keys['A'])   dx=-1;
  if (keys['ArrowRight']||keys['d']||keys['D'])  dx=1;

  if (dx&&dy) { dx*=0.707; dy*=0.707; }

  const nx = player.x + dx*player.speed*dt*0.1;
  const ny = player.y + dy*player.speed*dt*0.1;

  const pr = 10; // player radius
  // Check bounds + rocks
  const gx = Math.floor(nx/TILE), gy = Math.floor(ny/TILE);

  if (nx-pr>=0 && nx+pr<W && !isSolid(Math.floor((nx-pr)/TILE), gy) && !isSolid(Math.floor((nx+pr)/TILE),gy))
    player.x = nx;
  if (ny-pr>=0 && ny+pr<H && !isSolid(gx, Math.floor((ny-pr)/TILE)) && !isSolid(gx,Math.floor((ny+pr)/TILE)))
    player.y = ny;

  if (dx||dy) player.facing = {x:dx,y:dy};
  player.bobT += dt * 0.008;
}

function moveAliens(dt) {
  aliens.forEach(a => {
    a.wobble += dt * 0.003;
    a.moveTimer += dt;

    if (a.moveTimer < a.moveCooldown) return;
    a.moveTimer = 0;

    // Chaser: move toward player
    if (a.type === 1) {
      const dx = player.x - a.x;
      const dy = player.y - a.y;
      const len = Math.hypot(dx,dy)||1;
      const ndx = Math.round(dx/len), ndy = Math.round(dy/len);
      const nx = a.gx + ndx, ny = a.gy + ndy;
      if (isClear(nx,ny)) { a.gx=nx; a.gy=ny; }
    } else {
      // Patrol: random direction, prefer current
      const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const tries = Math.random()<0.7 ? [a.dir, ...shuffle(dirs)] : shuffle(dirs);
      for (const d of tries) {
        const nx=a.gx+d.x, ny=a.gy+d.y;
        if (isClear(nx,ny)) { a.gx=nx; a.gy=ny; a.dir=d; break; }
      }
    }
    a.x = a.gx*TILE+TILE/2;
    a.y = a.gy*TILE+TILE/2;
  });
}

function checkPartPickup() {
  parts.forEach(p => {
    if (p.collected) return;
    const dist = Math.hypot(player.x-p.x, player.y-p.y);
    if (dist < TILE*0.55) {
      p.collected = true;
      collected++;
      addParticles(p.x, p.y, '#ffab40', 10);
      updateHUD();
      if (collected >= TOTAL_PARTS) {
        gameRunning = false;
        setTimeout(winLevel, 400);
      }
    }
  });
}

function checkAlienCollision() {
  if (invincible) return;
  for (const a of aliens) {
    const dist = Math.hypot(player.x-a.x, player.y-a.y);
    if (dist < TILE*0.45) {
      lives--;
      addParticles(player.x, player.y, '#ef4444', 12);
      updateHUD();
      invincible = true;
      invTimer = 2000;
      if (lives <= 0) { gameRunning=false; setTimeout(gameOver,400); }
      break;
    }
  }
}

// ── Win / Lose ──
function winLevel() {
  if (level >= 3) {
    showOverlay('🏆','MISSION ERFÜLLT!',
      'Alle Raketenteile gesammelt! Die Rakete kann starten!',
      'Du bist ein echter Mars-Held, Markus! 🚀',
      '🔄 Nochmal spielen', ()=>startGame(1));
  } else {
    showOverlay('⭐','LEVEL ' + level + ' GESCHAFFT!',
      'Weiter zu Level ' + (level+1) + '! Die Aliens werden schneller...',
      collected + ' / ' + TOTAL_PARTS + ' Teile gesammelt',
      '▶ Weiter!', ()=>nextLevel());
  }
}

function gameOver() {
  showOverlay('💀','GAME OVER',
    'Die grünen Männchen haben dich erwischt! Markus muss es nochmal versuchen.',
    collected + ' von ' + TOTAL_PARTS + ' Teilen gesammelt',
    '🔄 Nochmal', ()=>startGame(1));
}

function showOverlay(icon, title, msg, score, btnText, cb) {
  document.getElementById('ovIcon').textContent  = icon;
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovMsg').textContent   = msg;
  const sd = document.getElementById('ovScore');
  sd.style.display = 'block';
  sd.textContent = score;
  const btn = document.getElementById('btnStart');
  btn.textContent = btnText;
  btn.onclick = cb;
  document.getElementById('overlay').classList.remove('hidden');
}

// ── Particles ──
function addParticles(x, y, color, count) {
  for (let i=0;i<count;i++) {
    const a = (Math.PI*2/count)*i + Math.random()*0.3;
    particles.push({x,y,
      vx: Math.cos(a)*(1.5+Math.random()*3),
      vy: Math.sin(a)*(1.5+Math.random()*3),
      r: 2+Math.random()*3,
      color, life: 1, decay: 0.04+Math.random()*0.03
    });
  }
}

function updateParticles() {
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.9; p.vy*=0.9;
    p.life-=p.decay;
  });
}

// ── Draw ──
function draw() {
  // Mars ground
  ctx.fillStyle = '#8B2500';
  ctx.fillRect(0,0,W,H);

  // Subtle ground pattern
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) {
    const shade = ((x+y)%2===0) ? 'rgba(0,0,0,0.04)' : 'rgba(255,255,255,0.02)';
    ctx.fillStyle = shade;
    ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
  }

  // Craters
  craters.forEach(c=>{
    const g = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
    g.addColorStop(0,'rgba(0,0,0,0.35)');
    g.addColorStop(0.7,'rgba(0,0,0,0.1)');
    g.addColorStop(1,'rgba(255,255,255,0.05)');
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.r,c.r*0.55,0,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.r,c.r*0.55,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.2)';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });

  // Rocks
  rocks.forEach(r=>{
    const rx=r.x*TILE+TILE/2, ry=r.y*TILE+TILE/2;
    ctx.fillStyle='#5D2B0A';
    ctx.beginPath();
    ctx.ellipse(rx,ry+4,TILE*0.38,TILE*0.2,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#7A3B16';
    ctx.beginPath();
    ctx.ellipse(rx,ry,TILE*0.35,TILE*0.38,0.3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(rx-4,ry-5,TILE*0.12,TILE*0.08,-0.4,0,Math.PI*2);
    ctx.fill();
  });

  // Parts (rocket pieces)
  const t = Date.now()/1000;
  parts.forEach(p=>{
    if (p.collected) return;
    p.bob += 0.04;
    const bob = Math.sin(p.bob)*3;
    drawRocketPart(p.x, p.y+bob);
  });

  // Aliens
  aliens.forEach(a=>drawAlien(a));

  // Player
  drawPlayer();

  // Particles
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=p.life;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=6;
    ctx.fill();
    ctx.restore();
  });

  // Invincible flash
  if (invincible && Math.floor(Date.now()/120)%2===0) {
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(0,0,W,H);
  }
}

function drawRocketPart(x, y) {
  ctx.save();
  ctx.shadowColor='#ffab40';
  ctx.shadowBlur=12;

  // Body
  ctx.fillStyle='#ffab40';
  ctx.beginPath();
  ctx.roundRect(x-7, y-10, 14, 18, 3);
  ctx.fill();

  // Nose
  ctx.fillStyle='#ff7043';
  ctx.beginPath();
  ctx.moveTo(x, y-18);
  ctx.lineTo(x-6, y-10);
  ctx.lineTo(x+6, y-10);
  ctx.closePath();
  ctx.fill();

  // Window
  ctx.fillStyle='rgba(100,200,255,0.8)';
  ctx.beginPath();
  ctx.arc(x, y-3, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(x-1.5, y-4.5, 1.5, 0, Math.PI*2);
  ctx.fill();

  // Fins
  ctx.fillStyle='#e64a19';
  ctx.beginPath();
  ctx.moveTo(x-7, y+8);
  ctx.lineTo(x-12, y+14);
  ctx.lineTo(x-7, y+14);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+7, y+8);
  ctx.lineTo(x+12, y+14);
  ctx.lineTo(x+7, y+14);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawAlien(a) {
  const bob = Math.sin(a.wobble)*3;
  const ax=a.x, ay=a.y+bob;

  ctx.save();
  ctx.shadowColor='#4caf50';
  ctx.shadowBlur=10;

  // Body
  ctx.fillStyle='#43a047';
  ctx.beginPath();
  ctx.ellipse(ax, ay, 14, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // Belly
  ctx.fillStyle='#66bb6a';
  ctx.beginPath();
  ctx.ellipse(ax, ay+4, 8, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // Eyes (big scary ones)
  [-6,6].forEach(ex=>{
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(ax+ex, ay-6, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // Pupils – look at player
    const dx=player.x-ax, dy=player.y-ay;
    const len=Math.hypot(dx,dy)||1;
    ctx.fillStyle='#1a237e';
    ctx.beginPath();
    ctx.arc(ax+ex+dx/len*2, ay-6+dy/len*2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(ax+ex+dx/len*2-1, ay-6+dy/len*2-1, 1, 0, Math.PI*2);
    ctx.fill();
  });

  // Antennae
  ctx.strokeStyle='#2e7d32'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ax-6,ay-16); ctx.lineTo(ax-10,ay-26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax+6,ay-16); ctx.lineTo(ax+10,ay-26); ctx.stroke();
  ctx.fillStyle='#a5d6a7';
  ctx.beginPath(); ctx.arc(ax-10,ay-26,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ax+10,ay-26,3,0,Math.PI*2); ctx.fill();

  // Mouth (grin)
  ctx.strokeStyle='#1b5e20'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(ax, ay+6, 6, 0.2, Math.PI-0.2);
  ctx.stroke();

  ctx.restore();
}

function drawPlayer() {
  const px=player.x, py=player.y;
  const bob=Math.sin(player.bobT)*2;
  const flash = invincible && Math.floor(Date.now()/120)%2===0;

  ctx.save();
  if (flash) ctx.globalAlpha=0.4;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py+16, 12, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Boots
  ctx.fillStyle='#455a64';
  ctx.fillRect(px-11, py+8+bob, 9, 7);
  ctx.fillRect(px+2,  py+8+bob, 9, 7);

  // Suit legs
  ctx.fillStyle='#eceff1';
  ctx.fillRect(px-10, py-2+bob, 8, 12);
  ctx.fillRect(px+2,  py-2+bob, 8, 12);

  // Suit body
  ctx.fillStyle='#eceff1';
  ctx.beginPath();
  ctx.roundRect(px-12, py-14+bob, 24, 18, 4);
  ctx.fill();

  // Suit chest stripe
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-4, py-12+bob, 8, 6);

  // Arms
  ctx.fillStyle='#bdbdbd';
  ctx.fillRect(px-18, py-12+bob, 7, 14);
  ctx.fillRect(px+11,  py-12+bob, 7, 14);

  // Helmet
  ctx.fillStyle='#b0bec5';
  ctx.beginPath();
  ctx.arc(px, py-20+bob, 14, 0, Math.PI*2);
  ctx.fill();

  // Visor
  const vg = ctx.createRadialGradient(px-3,py-22+bob,1,px,py-20+bob,11);
  vg.addColorStop(0,'rgba(100,210,255,0.9)');
  vg.addColorStop(1,'rgba(0,100,200,0.6)');
  ctx.fillStyle=vg;
  ctx.beginPath();
  ctx.ellipse(px, py-20+bob, 9, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Visor shine
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(px-3, py-24+bob, 4, 3, -0.5, 0, Math.PI*2);
  ctx.fill();

  // Backpack
  ctx.fillStyle='#78909c';
  ctx.beginPath();
  ctx.roundRect(px+10, py-13+bob, 8, 14, 3);
  ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.fillRect(px+12, py-8+bob, 4, 2);
  ctx.fillStyle='#ff5722';
  ctx.fillRect(px+12, py-4+bob, 4, 2);

  ctx.restore();
}

// ── Utils ──
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── Input ──
document.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e=>{ keys[e.key]=false; });

// Touch / D-pad alternative
let touch0=null;
canvas.addEventListener('touchstart',e=>{touch0={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!touch0) return;
  const dx=e.touches[0].clientX-touch0.x, dy=e.touches[0].clientY-touch0.y;
  keys['ArrowLeft']=dx<-10; keys['ArrowRight']=dx>10;
  keys['ArrowUp']=dy<-10;   keys['ArrowDown']=dy>10;
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{
  keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;
  touch0=null;
},{passive:true});

// Initial draw
ctx.fillStyle='#8B2500';
ctx.fillRect(0,0,W,H);
</script>
