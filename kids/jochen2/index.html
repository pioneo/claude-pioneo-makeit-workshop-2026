<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Jochen2's Jump & Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0a0a2e 0%, #1a1a5e 50%, #2d2d8a 100%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
    font-family: 'Courier New', monospace; color: white; overflow: hidden;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; text-shadow: 0 0 20px #fff; }
  #score-bar { font-size: 1.2rem; margin-bottom: 12px; letter-spacing: 2px; }
  #canvas {
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(100,100,255,0.5);
    cursor: pointer;
  }
  #msg {
    margin-top: 14px; font-size: 1.1rem;
    color: #aaf; text-align: center; min-height: 1.5em;
  }
</style>
</head>
<body>
<h1>🚀 Jochen2's Weltraum-Jump</h1>
<div id="score-bar">⭐ Punkte: <span id="pts">0</span> &nbsp;|&nbsp; 🏆 Rekord: <span id="hi">0</span></div>
<canvas id="canvas" width="700" height="320"></canvas>
<div id="msg">Leertaste oder Tippen zum Starten!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ptsEl = document.getElementById('pts');
const hiEl = document.getElementById('hi');
const msgEl = document.getElementById('msg');

// ── Stars ──────────────────────────────────────────────
const stars = Array.from({length: 80}, () => ({
  x: Math.random() * 700,
  y: Math.random() * 320,
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 0.8 + 0.2,
  alpha: Math.random()
}));

function drawStars(speed) {
  stars.forEach(s => {
    s.x -= s.speed * speed;
    if (s.x < 0) { s.x = 700; s.y = Math.random() * 320; }
    ctx.save();
    ctx.globalAlpha = 0.4 + s.alpha * 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Player ─────────────────────────────────────────────
const GROUND = 260;
const player = {
  x: 80, y: GROUND, w: 40, h: 44,
  vy: 0, jumps: 0,
  trail: [],
  draw() {
    // trail
    this.trail.forEach((t, i) => {
      ctx.save();
      ctx.globalAlpha = (i / this.trail.length) * 0.3;
      ctx.fillStyle = '#88f';
      ctx.beginPath();
      ctx.ellipse(t.x + this.w/2, t.y + this.h/2, this.w/2, this.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    // body: rocket
    ctx.save();
    // flame
    if (this.vy !== 0 || game.speed > 1) {
      const flameH = 10 + Math.random() * 14;
      const grad = ctx.createLinearGradient(this.x+20, this.y+this.h, this.x+20, this.y+this.h+flameH);
      grad.addColorStop(0, '#ff0');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(this.x+12, this.y+this.h);
      ctx.lineTo(this.x+28, this.y+this.h);
      ctx.lineTo(this.x+20, this.y+this.h+flameH);
      ctx.fill();
    }
    // body
    ctx.fillStyle = '#cce';
    ctx.beginPath();
    ctx.roundRect(this.x+8, this.y+12, 24, 28, 4);
    ctx.fill();
    // nose
    ctx.fillStyle = '#aaf';
    ctx.beginPath();
    ctx.moveTo(this.x+8, this.y+12);
    ctx.lineTo(this.x+32, this.y+12);
    ctx.lineTo(this.x+20, this.y);
    ctx.closePath();
    ctx.fill();
    // window
    ctx.fillStyle = '#4df';
    ctx.beginPath();
    ctx.arc(this.x+20, this.y+22, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // fins
    ctx.fillStyle = '#88c';
    ctx.beginPath();
    ctx.moveTo(this.x+8, this.y+36);
    ctx.lineTo(this.x, this.y+44);
    ctx.lineTo(this.x+8, this.y+40);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(this.x+32, this.y+36);
    ctx.lineTo(this.x+40, this.y+44);
    ctx.lineTo(this.x+32, this.y+40);
    ctx.fill();
    ctx.restore();
  },
  jump() {
    if (this.jumps < 2) {
      this.vy = -13;
      this.jumps++;
    }
  },
  update() {
    this.trail.unshift({x: this.x, y: this.y});
    if (this.trail.length > 8) this.trail.pop();
    this.vy += 0.55;
    this.y += this.vy;
    if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.jumps = 0; }
  }
};

// ── Obstacles ──────────────────────────────────────────
const OBSTACLE_TYPES = [
  { w: 28, h: 48, color: '#f55', label: '☄️' },
  { w: 36, h: 32, color: '#f90', label: '🪨' },
  { w: 22, h: 60, color: '#f44', label: '☄️' },
];

let obstacles = [];
let particles = [];

function spawnObstacle() {
  const t = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  obstacles.push({
    x: 720, y: GROUND + 44 - t.h,
    w: t.w, h: t.h,
    color: t.color, label: t.label
  });
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    ctx.font = `${o.h * 0.8}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText(o.label, o.x + o.w/2, o.y + o.h);
    ctx.restore();
  });
}

// ── Collectibles ───────────────────────────────────────
let coins = [];
function spawnCoin() {
  coins.push({
    x: 720,
    y: GROUND - 40 - Math.random() * 80,
    r: 10, collected: false, alpha: 1
  });
}
function drawCoins() {
  coins.forEach(c => {
    if (c.collected) return;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff8';
    ctx.beginPath();
    ctx.arc(c.x - 3, c.y - 3, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Particles ──────────────────────────────────────────
function spawnParticles(x, y) {
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      color: `hsl(${Math.random()*60+10},100%,60%)`
    });
  }
}

// ── Ground ─────────────────────────────────────────────
function drawGround() {
  const grad = ctx.createLinearGradient(0, GROUND+44, 0, 320);
  grad.addColorStop(0, '#2a2a6a');
  grad.addColorStop(1, '#0a0a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, GROUND + 44, 700, 320 - (GROUND+44));

  ctx.strokeStyle = 'rgba(150,150,255,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 44);
  ctx.lineTo(700, GROUND + 44);
  ctx.stroke();
}

// ── Game state ─────────────────────────────────────────
const game = {
  running: false, over: false,
  score: 0, hi: 0,
  frame: 0, speed: 4,
  nextObstacle: 80, nextCoin: 50
};

function reset() {
  obstacles = []; coins = []; particles = [];
  player.y = GROUND; player.vy = 0; player.jumps = 0; player.trail = [];
  game.score = 0; game.frame = 0; game.speed = 4;
  game.nextObstacle = 80; game.nextCoin = 50;
  game.running = true; game.over = false;
  msgEl.textContent = '';
}

function checkCollision(a, b) {
  const pad = 6;
  return a.x + pad < b.x + b.w &&
         a.x + a.w - pad > b.x &&
         a.y + pad < b.y + b.h &&
         a.y + a.h - pad > b.y;
}

// ── Main loop ──────────────────────────────────────────
function loop() {
  ctx.clearRect(0, 0, 700, 320);

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 320);
  bgGrad.addColorStop(0, '#040418');
  bgGrad.addColorStop(1, '#1a1a5e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 700, 320);

  drawStars(game.running ? game.speed / 4 : 0.3);
  drawGround();

  if (game.running) {
    game.frame++;
    game.speed = 4 + game.frame / 500;

    // Obstacles
    game.nextObstacle--;
    if (game.nextObstacle <= 0) {
      spawnObstacle();
      game.nextObstacle = Math.floor(60 + Math.random() * 60 - game.speed * 4);
    }
    obstacles.forEach(o => { o.x -= game.speed; });
    obstacles = obstacles.filter(o => o.x > -60);

    // Coins
    game.nextCoin--;
    if (game.nextCoin <= 0) {
      spawnCoin();
      game.nextCoin = Math.floor(40 + Math.random() * 50);
    }
    coins.forEach(c => { c.x -= game.speed; });
    coins = coins.filter(c => c.x > -20);

    player.update();

    // Coin collection
    coins.forEach(c => {
      if (!c.collected && checkCollision(player, {x:c.x-c.r, y:c.y-c.r, w:c.r*2, h:c.r*2})) {
        c.collected = true;
        game.score += 5;
      }
    });

    // Obstacle collision
    for (const o of obstacles) {
      if (checkCollision(player, o)) {
        spawnParticles(player.x + 20, player.y + 22);
        game.running = false; game.over = true;
        if (game.score > game.hi) game.hi = game.score;
        hiEl.textContent = game.hi;
        msgEl.textContent = `💥 ${game.score} Punkte! Leertaste für nochmal`;
        break;
      }
    }

    // Score
    if (game.frame % 6 === 0) game.score++;
    ptsEl.textContent = game.score;
  }

  drawObstacles();
  drawCoins();
  player.draw();

  // Particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.04;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
  particles = particles.filter(p => p.life > 0);

  // Start screen
  if (!game.running && !game.over) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, 700, 320);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('🚀 Jochen2\'s Weltraum-Jump', 350, 130);
    ctx.font = '22px Courier New';
    ctx.fillStyle = '#aaf';
    ctx.fillText('Leertaste / Tippen = Springen (2× = Doppelsprung!)', 350, 175);
    ctx.fillText('Münzen sammeln ⭐ | Hindernissen ausweichen ☄️', 350, 210);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// ── Input ──────────────────────────────────────────────
function handleInput() {
  if (!game.running) { reset(); }
  else { player.jump(); }
}
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); } });
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, {passive: false});

loop();
</script>
</body>
</html>
