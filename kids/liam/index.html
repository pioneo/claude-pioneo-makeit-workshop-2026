<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liam's Star Wars Quiz ⭐</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#020008;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;
    color:#fff;gap:.4rem;padding:.4rem;user-select:none}
  h1{font-size:clamp(1rem,3.5vw,1.5rem);font-weight:900;
    background:linear-gradient(135deg,#facc15,#a855f7,#facc15);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  canvas{border-radius:10px;border:2px solid rgba(168,85,247,.4);
    box-shadow:0 0 60px rgba(168,85,247,.25),0 20px 60px rgba(0,0,0,.9);display:block}
  .hint{font-size:.62rem;color:#1e1030;letter-spacing:.06em}
</style>
</head>
<body>
<h1>⚔️ Liam's Star Wars Quiz</h1>
<canvas id="c"></canvas>
<div class="hint">Klicke auf die richtige Antwort — du hast 15 Sekunden pro Frage!</div>
<script>
const W=700,H=460;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;

const CHILD='Liam';
const TOTAL_Q=10;
const TIME_PER_Q=15;

// ── Questions pool ─────────────────────────
const POOL=[
  {q:'Wer ist Luke Skywalkers Vater?',a:['Darth Vader','Obi-Wan Kenobi','Han Solo','Palpatine'],c:0},
  {q:'Welche Farbe hat Yodas Lichtschwert?',a:['Grün','Blau','Rot','Lila'],c:0},
  {q:'Von welchem Planeten kommt Luke Skywalker?',a:['Tatooine','Alderaan','Coruscant','Dagobah'],c:0},
  {q:'Wie heißt Han Solos Raumschiff?',a:['Millennium Falcon','X-Wing','TIE Fighter','Star Destroyer'],c:0},
  {q:'Wer hat den Roboter C-3PO gebaut?',a:['Anakin Skywalker','Luke Skywalker','R2-D2','Obi-Wan'],c:0},
  {q:'Was ist Chewbaccas Spezies?',a:['Wookiee','Ewok','Jawa','Gungan'],c:0},
  {q:'Welche Farbe hat Darth Vaders Lichtschwert?',a:['Rot','Blau','Grün','Lila'],c:0},
  {q:'Auf welchem Planeten leben die Ewoks?',a:['Endor','Naboo','Mustafar','Hoth'],c:0},
  {q:'Welche Farben hat Lukes Lichtschwert?',a:['Blau','Grün','Rot','Gelb'],c:[0,1]},
  {q:'Wie viele Finger hat Yoda?',a:['3','4','5','6'],c:0},
  {q:'Welche Farbe trägt Darth Vader?',a:['Schwarz','Weiß','Grau','Rot'],c:0},
  {q:'Wer ist der Anführer der Rebellen in Episode 4?',a:['Prinzessin Leia','Luke','Han Solo','Lando'],c:0},
  {q:'Auf welchem Eisplaneten befindet sich die Rebellenbasis in Episode 5?',a:['Hoth','Endor','Dagobah','Mustafar'],c:0},
  {q:'Was ist die dunkle Seite der Macht?',a:['Hass und Zorn','Liebe und Frieden','Stärke und Mut','Weisheit und Geduld'],c:0},
  {q:'Wer trainiert Luke Skywalker auf Dagobah?',a:['Yoda','Obi-Wan','Darth Vader','Leia'],c:0},
];

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

// ── State ──────────────────────────────────
let scene='menu';
let questions=[],qIdx=0,score=0;
let selected=-1,feedbackTimer=0;
let timer=TIME_PER_Q,timerTick=0;
let frameT=0;
let hovBtn=-1;
const STARS=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.5,speed:.2+Math.random()*.8}));

const BTNS=[
  {x:40, y:285,w:300,h:64},
  {x:360,y:285,w:300,h:64},
  {x:40, y:358,w:300,h:64},
  {x:360,y:358,w:300,h:64},
];

function startGame(){
  questions=shuffle(POOL).slice(0,TOTAL_Q);
  qIdx=0;score=0;selected=-1;feedbackTimer=0;timer=TIME_PER_Q;timerTick=0;
  scene='question';
}

function update(){
  frameT++;
  STARS.forEach(s=>{s.y+=s.speed;if(s.y>H)s.y=0;});
  if(scene==='question'){
    timerTick++;
    if(timerTick>=60){timerTick=0;timer--;
      if(timer<=0){selected=-1;feedbackTimer=90;scene='feedback';}
    }
  }
  if(scene==='feedback'){
    feedbackTimer--;
    if(feedbackTimer<=0){
      qIdx++;
      if(qIdx>=questions.length)scene='win';
      else{selected=-1;timer=TIME_PER_Q;timerTick=0;scene='question';}
    }
  }
}

function drawStars(){
  ctx.fillStyle='#020008';ctx.fillRect(0,0,W,H);
  STARS.forEach(s=>{
    ctx.fillStyle=`rgba(255,255,255,${.3+Math.sin(frameT*.02+s.x)*.25})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
}

function drawMenu(){
  drawStars();
  ctx.strokeStyle='rgba(168,85,247,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,120);ctx.lineTo(W,120);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H-80);ctx.lineTo(W,H-80);ctx.stroke();

  ctx.textAlign='center';
  ctx.font='bold 34px Segoe UI';
  const tg=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  tg.addColorStop(0,'#facc15');tg.addColorStop(.5,'#fef9c3');tg.addColorStop(1,'#facc15');
  ctx.fillStyle=tg;ctx.shadowColor='#facc15';ctx.shadowBlur=20;
  ctx.fillText(`${CHILD}'s Star Wars Quiz`,W/2,100);ctx.shadowBlur=0;

  ctx.font='13px Segoe UI';ctx.fillStyle='rgba(253,224,71,.7)';
  ctx.fillText('Eine Prüfung deines Jedi-Wissens erwartet dich…',W/2,138);

  ['🌟','⚔️','🚀','💫','⭐'].forEach((em,i)=>{
    ctx.font='28px Segoe UI';ctx.fillStyle='#fff';
    const a=frameT*.012+i*1.26;
    ctx.fillText(em,W/2-160+i*80,210+Math.sin(a)*10);
  });

  ctx.font='13px Segoe UI';ctx.fillStyle='#a78bfa';
  ctx.fillText(`${TOTAL_Q} Fragen · 15 Sekunden je Frage · Kannst du alle richtig beantworten?`,W/2,268);

  const p=Math.sin(frameT*.07)*5;
  ctx.fillStyle='rgba(168,85,247,.2)';ctx.beginPath();ctx.roundRect(W/2-140,300+p,280,56,14);ctx.fill();
  ctx.strokeStyle='#a855f7';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-140,300+p,280,56,14);ctx.stroke();
  ctx.font='bold 18px Segoe UI';ctx.fillStyle='#e9d5ff';
  ctx.fillText('⚔️  Quiz starten!',W/2,334+p);

  ctx.font='11px Segoe UI';ctx.fillStyle='#1e1030';
  ctx.fillText('Möge die Macht mit dir sein!',W/2,400);
  cv.onclick=()=>{startGame();cv.onclick=null;};
}

function drawQuestion(){
  const q=questions[qIdx];
  drawStars();
  ctx.textAlign='center';
  for(let i=0;i<TOTAL_Q;i++){
    ctx.fillStyle=i<qIdx?'#a855f7':i===qIdx?'#facc15':'rgba(255,255,255,.2)';
    ctx.beginPath();ctx.arc(W/2-TOTAL_Q*11+i*22,22,6,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#facc15';ctx.font='bold 14px Segoe UI';ctx.textAlign='right';
  ctx.fillText(`⭐ ${score}/${TOTAL_Q}`,W-12,26);

  const tPct=timer/TIME_PER_Q;
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(40,38,W-80,8,4);ctx.fill();
  const tc=tPct>.6?'#22c55e':tPct>.3?'#f59e0b':'#ef4444';
  ctx.fillStyle=tc;ctx.shadowColor=tc;ctx.shadowBlur=8;
  if(tPct>0)ctx.beginPath(),ctx.roundRect(40,38,(W-80)*tPct,8,4),ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='#c4b5fd';ctx.font='12px Segoe UI';ctx.textAlign='center';
  ctx.fillText(`Frage ${qIdx+1} von ${TOTAL_Q}`,W/2,68);

  ctx.fillStyle='rgba(168,85,247,.1)';ctx.beginPath();ctx.roundRect(30,76,W-60,90,12);ctx.fill();
  ctx.strokeStyle='rgba(168,85,247,.3)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(30,76,W-60,90,12);ctx.stroke();
  ctx.fillStyle='#f3e8ff';ctx.font='bold 16px Segoe UI';ctx.textAlign='center';
  const words=q.q.split(' ');let line='',lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>W-100){lines.push(line);line=w;}else line=t;});
  lines.push(line);
  const lineH=22,startY=76+(90-lines.length*lineH)/2+lineH;
  lines.forEach((l,i)=>ctx.fillText(l,W/2,startY+i*lineH));

  const shuffled=q._shuffled||(q._shuffled=shuffle(q.a.map((a,i)=>({a,orig:i}))));
  BTNS.forEach((b,i)=>{
    const opt=shuffled[i];
    const isHov=hovBtn===i;
    ctx.fillStyle=isHov?'rgba(168,85,247,.35)':'rgba(255,255,255,.06)';
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,10);ctx.fill();
    ctx.strokeStyle=isHov?'#a855f7':'rgba(255,255,255,.15)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,10);ctx.stroke();
    const label=['A','B','C','D'][i];
    ctx.fillStyle=isHov?'#e9d5ff':'#a78bfa';ctx.font='bold 11px Segoe UI';ctx.textAlign='left';
    ctx.fillText(label,b.x+12,b.y+b.h/2+4);
    ctx.fillStyle=isHov?'#fff':'#e2e8f0';ctx.font='14px Segoe UI';ctx.textAlign='center';
    ctx.fillText(opt.a,b.x+b.w/2+10,b.y+b.h/2+5);
  });
}

function drawFeedback(){
  const q=questions[qIdx];
  const shuffled=q._shuffled;
  drawStars();
  const correct=selected>=0&&(Array.isArray(q.c)?q.c.includes(shuffled[selected].orig):shuffled[selected].orig===q.c);
  const timeup=selected<0;
  ctx.textAlign='center';
  ctx.font='bold 28px Segoe UI';
  const msg=timeup?'⏰ Zeit abgelaufen!':correct?'✅ Richtig!':'❌ Falsch!';
  const col=timeup?'#f59e0b':correct?'#22c55e':'#ef4444';
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=20;
  ctx.fillText(msg,W/2,H/2-50);ctx.shadowBlur=0;
  ctx.font='14px Segoe UI';ctx.fillStyle='#c4b5fd';
  ctx.fillText('Die richtige Antwort war:',W/2,H/2);
  ctx.font='bold 20px Segoe UI';ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=10;
  ctx.fillText(Array.isArray(q.c)?q.c.map(i=>q.a[i]).join(' oder '):q.a[q.c],W/2,H/2+34);ctx.shadowBlur=0;
  const p2=feedbackTimer/90;
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(W/2-100,H/2+70,200,6,3);ctx.fill();
  ctx.fillStyle='#a855f7';ctx.beginPath();ctx.roundRect(W/2-100,H/2+70,200*p2,6,3);ctx.fill();
}

function drawWin(){
  drawStars();
  ctx.textAlign='center';
  const rank=score>=9?'Jedi-Meister! 🏆':score>=7?'Jedi-Ritter! ⭐':score>=5?'Padawan 🌟':'Anfänger 💫';
  const col=score>=9?'#facc15':score>=7?'#a855f7':score>=5?'#3b82f6':'#94a3b8';
  ctx.font='52px Segoe UI';ctx.fillText(score>=9?'🏆':score>=7?'⭐':'🌟',W/2,100);
  ctx.font='bold 26px Segoe UI';ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=20;
  ctx.fillText(`${CHILD} ist ${rank}`,W/2,154);ctx.shadowBlur=0;
  ctx.font='20px Segoe UI';ctx.fillStyle='#e2e8f0';
  ctx.fillText(`Du hast ${score} von ${TOTAL_Q} Fragen richtig!`,W/2,196);
  for(let i=0;i<TOTAL_Q;i++){
    ctx.fillStyle=i<score?'#facc15':'rgba(255,255,255,.15)';
    ctx.font='20px Segoe UI';ctx.fillText('★',W/2-TOTAL_Q*14+i*28,238);
  }
  ctx.font='13px Segoe UI';ctx.fillStyle='#a78bfa';
  const msg=score>=9?'Beeindruckend! Die Macht ist stark in dir!':score>=7?'Gut gemacht! Du wirst ein großer Jedi!':score>=5?'Nicht schlecht! Übe weiter, Padawan!':'Keine Sorge, Yoda hat auch klein angefangen!';
  ctx.fillText(msg,W/2,272);
  const p=Math.sin(frameT*.07)*4;
  ctx.fillStyle='rgba(168,85,247,.2)';ctx.beginPath();ctx.roundRect(W/2-120,295+p,240,50,14);ctx.fill();
  ctx.strokeStyle='#a855f7';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-120,295+p,240,50,14);ctx.stroke();
  ctx.font='bold 15px Segoe UI';ctx.fillStyle='#e9d5ff';
  ctx.fillText('🔄 Nochmal spielen',W/2,326+p);
  cv.onclick=()=>{cv.onclick=null;scene='menu';};
}

cv.addEventListener('mousemove',e=>{
  if(scene!=='question'){hovBtn=-1;return;}
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  hovBtn=BTNS.findIndex(b=>mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h);
  cv.style.cursor=hovBtn>=0?'pointer':'default';
});

cv.addEventListener('click',e=>{
  if(scene==='win'){scene='menu';cv.onclick=null;return;}
  if(scene!=='question')return;
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  const bi=BTNS.findIndex(b=>mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h);
  if(bi<0)return;
  selected=bi;
  const q=questions[qIdx];
  if(Array.isArray(q.c)?q.c.includes(q._shuffled[bi].orig):q._shuffled[bi].orig===q.c)score++;
  feedbackTimer=90;scene='feedback';
});

function loop(){
  requestAnimationFrame(loop);
  update();
  if(scene==='menu')drawMenu();
  else if(scene==='question')drawQuestion();
  else if(scene==='feedback')drawFeedback();
  else if(scene==='win')drawWin();
}
loop();
</script>
</body>
</html>
