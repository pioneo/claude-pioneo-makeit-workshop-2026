<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathildas Hausbau 🏠</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a0a2e;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 0.7rem; gap: 0.6rem; user-select: none;
    }
    h1 {
      font-size: clamp(1.2rem,4vw,1.8rem); font-weight: 900;
      background: linear-gradient(135deg,#f9a8d4,#c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(236,72,153,0.5)); text-align: center;
    }
    .sub { color:#9d8ba7; font-size:0.73rem; letter-spacing:0.06em; text-align:center; }

    .main { display:flex; gap:0.7rem; align-items:flex-start; }

    .canvas-wrap {
      position:relative; border-radius:12px; overflow:hidden;
      border:2px solid rgba(192,132,252,0.4);
      box-shadow:0 0 30px rgba(192,132,252,0.2),0 16px 40px rgba(0,0,0,0.7);
      cursor:crosshair; background:#090618;
    }
    canvas { display:block; }

    /* Sidebar */
    .sidebar { display:flex; flex-direction:column; gap:0.5rem; width:90px; }
    .panel {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(192,132,252,0.2);
      border-radius:10px; padding:0.5rem;
    }
    .panel-title {
      font-size:0.58rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.1em; color:#a78bfa; margin-bottom:0.4rem; text-align:center;
    }
    .palette { display:grid; grid-template-columns:1fr 1fr; gap:3px; }
    .blk {
      width:36px; height:36px; border-radius:7px;
      border:2px solid transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; transition:transform 0.1s;
      background:rgba(255,255,255,0.07);
    }
    .blk:hover { transform:scale(1.1); border-color:rgba(255,255,255,0.3); }
    .blk.sel  { border-color:#f9a8d4; box-shadow:0 0 8px rgba(249,168,212,0.5); }

    .floors { display:flex; flex-direction:column; gap:3px; }
    .flr {
      width:100%; padding:0.22rem 0; border-radius:6px;
      border:1.5px solid rgba(192,132,252,0.2);
      background:rgba(255,255,255,0.04); color:#c4b5fd;
      font-size:0.7rem; font-weight:700; cursor:pointer; text-align:center;
      transition:all 0.1s;
    }
    .flr:hover { background:rgba(192,132,252,0.15); }
    .flr.sel { background:rgba(192,132,252,0.25); border-color:#a78bfa; color:#fff; }

    .rot-row { display:flex; gap:3px; }
    .rot {
      flex:1; padding:0.38rem 0; border-radius:7px;
      border:1.5px solid rgba(192,132,252,0.25);
      background:rgba(255,255,255,0.05); color:#c4b5fd;
      font-size:1rem; cursor:pointer; transition:all 0.12s;
    }
    .rot:hover { background:rgba(192,132,252,0.2); transform:scale(1.08); }
    .cam-lbl { text-align:center; font-size:0.62rem; color:#7c3aed; margin-top:3px; }

    .bottom {
      display:flex; gap:0.7rem; align-items:center;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(192,132,252,0.18);
      border-radius:10px; padding:0.45rem 0.9rem;
      font-size:0.73rem; color:#9d8ba7;
    }
    .bottom strong { color:#f9a8d4; }
    .clr {
      padding:0.3rem 0.8rem; border-radius:7px;
      border:1.5px solid rgba(239,68,68,0.3);
      background:rgba(239,68,68,0.1); color:#fca5a5;
      font-size:0.7rem; font-weight:700; cursor:pointer;
    }
    .clr:hover { background:rgba(239,68,68,0.2); }
  </style>
</head>
<body>

<h1>🏠 Mathildas Hausbau</h1>
<p class="sub">Klicken = Bauen &nbsp;·&nbsp; Rechtsklick = Löschen &nbsp;·&nbsp; ◀ ▶ = Seite wechseln</p>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="c" width="430" height="430"></canvas>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">Steine</div>
      <div class="palette" id="pal"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Etage</div>
      <div class="floors" id="flrs"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Seite</div>
      <div class="rot-row">
        <button class="rot" onclick="rotate(-1)">◀</button>
        <button class="rot" onclick="rotate(1)">▶</button>
      </div>
      <div class="cam-lbl" id="clbl">Vorne</div>
    </div>
  </div>
</div>

<div class="bottom">
  <span>Links: <strong>Bauen</strong></span>
  <span>Rechts: <strong>Löschen</strong></span>
  <button class="clr" onclick="clearGrid()">🗑️ Neu</button>
</div>

<script>
// ── Constants ──
const GW=7, GD=7, GH=5;
const TW=54, TH=27, TZ=32; // tile width, tile depth, block height
const OX=215, OY=120;       // isometric origin on canvas

// ── Block definitions (index = type number stored in grid) ──
// IMPORTANT: index 0 = empty (never drawn)
const BLOCKS = [
  null,
  // id  emoji  label           top         left        right
  { e:'🌿', n:'Gras',       t:'#4ade80', l:'#16a34a', r:'#15803d' },  // 1
  { e:'🟥', n:'Rote Wand',  t:'#f87171', l:'#dc2626', r:'#b91c1c' },  // 2
  { e:'🟨', n:'Gelbe Wand', t:'#fde047', l:'#ca8a04', r:'#a16207' },  // 3
  { e:'🩷', n:'Rosa Wand',  t:'#f9a8d4', l:'#ec4899', r:'#be185d' },  // 4
  { e:'⬜', n:'Weiß',       t:'#f1f5f9', l:'#94a3b8', r:'#64748b' },  // 5
  { e:'🟦', n:'Blaue Wand', t:'#7dd3fc', l:'#2563eb', r:'#1d4ed8' },  // 6
  { e:'🟪', n:'Lila Wand',  t:'#d8b4fe', l:'#9333ea', r:'#7e22ce' },  // 7
  { e:'🪵', n:'Holzboden',  t:'#d97706', l:'#92400e', r:'#78350f', floor:true }, // 8
  { e:'🪟', n:'Fenster',    t:'#94a3b8', l:'#64748b', r:'#475569', win:true }, // 9
  { e:'🚪', n:'Tür',        t:'#a16207', l:'#78350f', r:'#451a03', door:true }, // 10
  { e:'🏠', n:'Dach',       t:'#f87171', l:'#b91c1c', r:'#991b1b', roof:true }, // 11
];

// ── Grid: grid[x][z][y]  (x=width, z=depth, y=height) ──
const grid = Array.from({length:GW},()=>
  Array.from({length:GD},()=>new Array(GH).fill(0)));

// Fill ground with grass (type 1)
for(let x=0;x<GW;x++) for(let z=0;z<GD;z++) grid[x][z][0]=1;

// ── Camera (0=SE, 1=SW, 2=NW, 3=NE) ──
let cam=0;
const CAM_NAMES=['Vorne','Rechts','Hinten','Links'];

// Selected state
let selBlock=2, selFloor=0;

// ── Camera coordinate transform ──
// Returns [ix, iz] (screen-space indices) from [gx, gz] (grid indices)
function toScreen(gx,gz) {
  switch(cam) {
    case 0: return [gx,gz];
    case 1: return [GD-1-gz,gx];
    case 2: return [GW-1-gx,GD-1-gz];
    case 3: return [gz,GW-1-gx];
  }
}
// Returns [gx, gz] from [ix, iz]
function toGrid(ix,iz) {
  switch(cam) {
    case 0: return [ix,iz];
    case 1: return [iz,GD-1-ix];
    case 2: return [GW-1-ix,GD-1-iz];
    case 3: return [GW-1-iz,ix];
  }
}

// ── Screen position of block's top-face center ──
function pos(ix,iz,iy) {
  return {
    sx: OX + (ix-iz)*TW/2,
    sy: OY + (ix+iz)*TH/2 - iy*TZ
  };
}

// ── Canvas & ctx ──
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');

// ── Build palette UI ──
const palEl=document.getElementById('pal');
BLOCKS.slice(1).forEach((b,i)=>{
  const id=i+1;
  const btn=document.createElement('button');
  btn.className='blk'+(id===selBlock?' sel':'');
  btn.title=b.n; btn.textContent=b.e; btn.dataset.id=id;
  btn.onclick=()=>{
    selBlock=id;
    document.querySelectorAll('.blk').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
  };
  palEl.appendChild(btn);
});

// ── Build floor UI ──
const flrsEl=document.getElementById('flrs');
['EG','1.OG','2.OG','3.OG','Dach'].forEach((n,f)=>{
  const btn=document.createElement('button');
  btn.className='flr'+(f===0?' sel':'');
  btn.textContent=n; btn.dataset.f=f;
  btn.onclick=()=>{
    selFloor=f;
    document.querySelectorAll('.flr').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    render();
  };
  flrsEl.appendChild(btn);
});

// ── Draw a single block ──
function drawBlock(ix,iz,iy,type) {
  const B=BLOCKS[type];
  if(!B) return;

  const {sx,sy}=pos(ix,iz,iy);
  const hw=TW/2, hh=TH/2, bh=TZ;

  // TOP FACE (rhombus / diamond)
  ctx.beginPath();
  ctx.moveTo(sx,    sy-hh);   // top vertex
  ctx.lineTo(sx+hw, sy);      // right vertex
  ctx.lineTo(sx,    sy+hh);   // bottom vertex
  ctx.lineTo(sx-hw, sy);      // left vertex
  ctx.closePath();
  ctx.fillStyle=B.t;
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=0.6; ctx.stroke();

  // LEFT FACE (goes down from left & bottom vertices)
  ctx.beginPath();
  ctx.moveTo(sx-hw, sy);        // top of left face (left vertex)
  ctx.lineTo(sx,    sy+hh);     // top of left face (bottom vertex of diamond)
  ctx.lineTo(sx,    sy+hh+bh);  // bottom-right of left face
  ctx.lineTo(sx-hw, sy+bh);     // bottom-left of left face
  ctx.closePath();
  ctx.fillStyle=B.l;
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.6; ctx.stroke();

  // RIGHT FACE (goes down from right & bottom vertices)
  ctx.beginPath();
  ctx.moveTo(sx+hw, sy);        // top-right
  ctx.lineTo(sx,    sy+hh);     // top-left (bottom vertex of diamond)
  ctx.lineTo(sx,    sy+hh+bh);  // bottom-left
  ctx.lineTo(sx+hw, sy+bh);     // bottom-right
  ctx.closePath();
  ctx.fillStyle=B.r;
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.6; ctx.stroke();

  // ── Specials ──

  // WINDOW: blue glass panes on left & right faces
  if(B.win) {
    const paneW=TW*0.25, paneH=bh*0.5, paneY=sy+hh+bh*0.18;
    // Left face pane
    ctx.fillStyle='rgba(147,210,255,0.75)';
    ctx.fillRect(sx-hw*0.7-paneW/2, paneY, paneW, paneH);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
    ctx.strokeRect(sx-hw*0.7-paneW/2, paneY, paneW, paneH);
    // Right face pane
    ctx.fillStyle='rgba(147,210,255,0.75)';
    ctx.fillRect(sx+hw*0.45-paneW/2, paneY, paneW, paneH);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
    ctx.strokeRect(sx+hw*0.45-paneW/2, paneY, paneW, paneH);
  }

  // DOOR: brown rectangle on bottom-center of left face
  if(B.door) {
    const dw=TW*0.22, dh=bh*0.7, dx=sx-hw*0.35-dw/2, dy=sy+hh+bh*0.28;
    ctx.fillStyle='#92400e';
    ctx.fillRect(dx,dy,dw,dh);
    ctx.strokeStyle='#78350f'; ctx.lineWidth=1; ctx.strokeRect(dx,dy,dw,dh);
    ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(dx+dw*0.8,dy+dh*0.55,1.8,0,Math.PI*2); ctx.fill();
  }

  // ROOF: triangular peak drawn above the block
  if(B.roof) {
    const peakY=sy-hh-bh*0.55;
    ctx.beginPath();
    ctx.moveTo(sx,    peakY);      // peak
    ctx.lineTo(sx+hw, sy-hh+TH);  // right base
    ctx.lineTo(sx-hw, sy-hh+TH);  // left base
    ctx.closePath();
    ctx.fillStyle='#ef4444';
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.8; ctx.stroke();
    // Ridge line
    ctx.strokeStyle='#b91c1c'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx,peakY); ctx.lineTo(sx,sy-hh+TH); ctx.stroke();
  }

  // FLOOR: subtle wood grain lines on top face
  if(B.floor) {
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=0.8;
    for(let i=1;i<3;i++) {
      const t=i/3;
      ctx.beginPath();
      ctx.moveTo(sx-hw+hw*t*2, sy-hh+TH*t);
      ctx.lineTo(sx+hw*t, sy+hh*t);
      ctx.stroke();
    }
  }
}

// ── Hover highlight ──
let hovIx=-1, hovIz=-1;
function drawHover() {
  if(hovIx<0||hovIz<0) return;
  const {sx,sy}=pos(hovIx,hovIz,selFloor);
  const hw=TW/2, hh=TH/2;
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  ctx.fillStyle='rgba(249,168,212,0.22)';
  ctx.fill();
  ctx.strokeStyle='#f9a8d4'; ctx.lineWidth=1.5; ctx.stroke();
}

// ── Main render ──
function render() {
  // Clear
  const bg=ctx.createLinearGradient(0,0,0,cv.height);
  bg.addColorStop(0,'#090618'); bg.addColorStop(1,'#120926');
  ctx.fillStyle=bg; ctx.fillRect(0,0,cv.width,cv.height);

  // ── Painter's algorithm: collect all filled cells, sort depth ──
  const calls=[];
  for(let gx=0;gx<GW;gx++) {
    for(let gz=0;gz<GD;gz++) {
      for(let gy=0;gy<GH;gy++) {
        const type=grid[gx][gz][gy];
        if(!type) continue;
        const [ix,iz]=toScreen(gx,gz);
        calls.push({ix,iz,iy:gy,type,depth:ix+iz+gy*0.01});
      }
    }
  }
  // Sort back-to-front (small depth = back)
  calls.sort((a,b)=>a.depth-b.depth || a.iy-b.iy);
  calls.forEach(c=>drawBlock(c.ix,c.iz,c.iy,c.type));

  // ── Hover ──
  drawHover();

  // ── Grid lines for selected floor ──
  ctx.strokeStyle='rgba(192,132,252,0.18)'; ctx.lineWidth=0.5;
  for(let ix=0;ix<=GW;ix++) {
    const a=pos(ix,0,selFloor), b=pos(ix,GD,selFloor);
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
  }
  for(let iz=0;iz<=GD;iz++) {
    const a=pos(0,iz,selFloor), b=pos(GW,iz,selFloor);
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
  }
}

// ── Click detection ──
function getCell(e) {
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(cv.width/rect.width);
  const my=(e.clientY-rect.top)*(cv.height/rect.height);
  // Inverse isometric at selFloor height
  const a=mx-OX, b=my-OY+selFloor*TZ;
  const ix=Math.round((a/(TW/2) + b/(TH/2))/2);
  const iz=Math.round((b/(TH/2) - a/(TW/2))/2);
  if(ix<0||ix>=GW||iz<0||iz>=GD) return null;
  const [gx,gz]=toGrid(ix,iz);
  return {gx,gz,ix,iz};
}

cv.addEventListener('mousemove',e=>{
  const g=getCell(e);
  hovIx=g?g.ix:-1; hovIz=g?g.iz:-1;
  render();
});
cv.addEventListener('mouseleave',()=>{ hovIx=-1; hovIz=-1; render(); });

cv.addEventListener('click',e=>{
  const g=getCell(e);
  if(!g) return;
  grid[g.gx][g.gz][selFloor]=selBlock;
  render();
});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const g=getCell(e);
  if(!g) return;
  grid[g.gx][g.gz][selFloor]=0;
  render();
});

// ── Rotate view ──
function rotate(d) {
  cam=(cam+d+4)%4;
  document.getElementById('clbl').textContent=CAM_NAMES[cam];
  render();
}

// ── Clear ──
function clearGrid() {
  for(let x=0;x<GW;x++) for(let z=0;z<GD;z++) for(let y=0;y<GH;y++) grid[x][z][y]=0;
  for(let x=0;x<GW;x++) for(let z=0;z<GD;z++) grid[x][z][0]=1;
  render();
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') { rotate(-1); e.preventDefault(); }
  if(e.key==='ArrowRight'){ rotate(1);  e.preventDefault(); }
  if(e.key==='ArrowUp'&&selFloor<GH-1) {
    selFloor++;
    document.querySelectorAll('.flr').forEach(b=>b.classList.remove('sel'));
    document.querySelector(`.flr[data-f="${selFloor}"]`).classList.add('sel');
    render(); e.preventDefault();
  }
  if(e.key==='ArrowDown'&&selFloor>0) {
    selFloor--;
    document.querySelectorAll('.flr').forEach(b=>b.classList.remove('sel'));
    document.querySelector(`.flr[data-f="${selFloor}"]`).classList.add('sel');
    render(); e.preventDefault();
  }
});

// ── Start ──
render();
</script>
</body>
</html>
