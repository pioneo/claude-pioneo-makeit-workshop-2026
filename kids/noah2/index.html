<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noah's Mario Kart 🏎️</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a1a; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff; gap: 0.4rem; padding: 0.4rem; user-select: none;
    }
    h1 {
      font-size: clamp(1rem,3.5vw,1.5rem); font-weight: 900;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    canvas { border-radius: 10px; border: 2px solid rgba(245,158,11,0.4);
      box-shadow: 0 0 40px rgba(245,158,11,0.1), 0 20px 60px rgba(0,0,0,0.8); display: block; }
    .hint { font-size: 0.65rem; color: #4a3a1a; letter-spacing: 0.08em; }
  </style>
</head>
<body>
<h1>🏎️ Noah's Mario Kart</h1>
<canvas id="c"></canvas>
<div class="hint">↑ / W = Gas &nbsp;·&nbsp; ↓ / S = Bremsen &nbsp;·&nbsp; ← → / A D = Lenken &nbsp;·&nbsp; Leertaste = Item benutzen</div>
<script>
const W=700, H=460;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W; cv.height=H;

// ── TRACK DEFINITION ──
// Centerline waypoints (world coords, track fits in 700x460)
const TRACK_PTS=[
  [350,60],[480,60],[580,100],[630,170],[620,260],[580,330],
  [500,380],[380,400],[260,400],[150,370],[90,300],[80,210],
  [110,140],[180,90],[260,65],[350,60],
];
const TRACK_W=54; // half-width of track

// Precompute cumulative distances for track progress
let trackSegs=[];
{
  for(let i=0;i<TRACK_PTS.length-1;i++){
    const [ax,ay]=TRACK_PTS[i], [bx,by]=TRACK_PTS[i+1];
    const dx=bx-ax, dy=by-ay;
    trackSegs.push({ ax,ay,bx,by,dx,dy, len:Math.hypot(dx,dy) });
  }
}
const TOTAL_LEN=trackSegs.reduce((s,t)=>s+t.len,0);

function getTrackT(x,y){
  // Returns [dist along track, dist from centerline]
  let best=Infinity, bestDist=Infinity;
  let cumLen=0;
  for(const seg of trackSegs){
    const t=Math.max(0,Math.min(1,((x-seg.ax)*seg.dx+(y-seg.ay)*seg.dy)/(seg.len*seg.len)));
    const cx=seg.ax+t*seg.dx, cy=seg.ay+t*seg.dy;
    const d=Math.hypot(x-cx,y-cy);
    if(d<bestDist){ bestDist=d; best=cumLen+t*seg.len; }
    cumLen+=seg.len;
  }
  return [best, bestDist];
}

function getTrackPos(dist){
  // Returns [x,y,angle] at dist along track
  dist=((dist%TOTAL_LEN)+TOTAL_LEN)%TOTAL_LEN;
  let cumLen=0;
  for(const seg of trackSegs){
    if(cumLen+seg.len>=dist){
      const t=(dist-cumLen)/seg.len;
      return [seg.ax+t*seg.dx, seg.ay+t*seg.dy, Math.atan2(seg.dy,seg.dx)];
    }
    cumLen+=seg.len;
  }
  return [TRACK_PTS[0][0],TRACK_PTS[0][1],0];
}

// ── ITEM BOXES ──
const ITEM_BOX_DISTS=[80,280,450,650,900,1100,1300,1500];
let itemBoxes=ITEM_BOX_DISTS.map(d=>{
  const [x,y]=getTrackPos(d);
  return { x,y,dist:d,active:true,respawn:0 };
});

// ── GAME STATE ──
let scene='menu';
let frameT=0, raceTimer=0, countdown=3;
let particles=[];

const LAPS=3;
const AI_COUNT=3;

const KART_COLORS=['#3b82f6','#ef4444','#22c55e','#f59e0b'];
const KART_NAMES=['Du','Bowser','Toad','Peach'];

function makeKart(id, startDist){
  const [x,y,angle]=getTrackPos(startDist);
  return {
    id, x,y,angle, vx:0,vy:0,speed:0,
    w:20, h:14,
    lap:0, trackDist:startDist, lastDist:startDist,
    item:null, itemCool:0,
    place:id+1,
    finished:false,
    // AI
    aiDist:startDist, aiTargetDist:startDist+60,
    spinTimer:0,
  };
}

let karts=[];
let bananas=[];
let shells=[];

function initRace(){
  karts=[
    makeKart(0, 40),
    makeKart(1, 0),
    makeKart(2, -40),
    makeKart(3, -80),
  ];
  bananas=[]; shells=[]; particles=[];
  raceTimer=0; countdown=3; frameT=0;
  itemBoxes.forEach(b=>{ b.active=true; b.respawn=0; });
}

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>keys[e.key]=false);

// ── PHYSICS ──
const MAX_SPEED=3.8, AI_MAX_SPEED=3.2;
const ACCEL=0.12, BRAKE=0.18, FRICTION=0.96, OFFTRACK_FRICTION=0.88;
const STEER=0.045;

function updateKart(k, isPlayer){
  if(k.finished) return;
  if(k.spinTimer>0){
    k.spinTimer--;
    k.angle+=0.2;
    k.speed*=0.9;
    k.x+=Math.cos(k.angle)*k.speed;
    k.y+=Math.sin(k.angle)*k.speed;
    return;
  }

  let accel=0, steer=0;
  if(isPlayer){
    if(keys['ArrowUp']||keys['w']||keys['W']) accel=1;
    if(keys['ArrowDown']||keys['s']||keys['S']) accel=-0.6;
    if(keys['ArrowLeft']||keys['a']||keys['A']) steer=-1;
    if(keys['ArrowRight']||keys['d']||keys['D']) steer=1;
  } else {
    // AI: steer toward target point on track
    const [tx,ty]=getTrackPos(k.aiTargetDist);
    const desiredAngle=Math.atan2(ty-k.y,tx-k.x);
    let diff=desiredAngle-k.angle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    steer=Math.max(-1,Math.min(1,diff*3));
    accel=0.95;
    // Advance AI target
    const distToTarget=Math.hypot(tx-k.x,ty-k.y);
    if(distToTarget<30) k.aiTargetDist+=50;
    // Wrap
    k.aiTargetDist=((k.aiTargetDist%TOTAL_LEN)+TOTAL_LEN)%TOTAL_LEN;
  }

  // Boost item
  const maxSpd=isPlayer?MAX_SPEED:AI_MAX_SPEED;
  if(k.boosting>0){ k.boosting--; k.speed=Math.min(maxSpd*1.6,k.speed+0.3); }
  else k.speed+=accel*ACCEL;
  k.speed=Math.max(-1.5,Math.min(maxSpd,k.speed));
  if(accel===0) k.speed*=FRICTION;
  if(accel<0) k.speed*=BRAKE;

  k.angle+=steer*STEER*(Math.abs(k.speed)/maxSpd*0.8+0.2)*Math.sign(k.speed);
  k.x+=Math.cos(k.angle)*k.speed;
  k.y+=Math.sin(k.angle)*k.speed;

  // Bounds
  k.x=Math.max(20,Math.min(W-20,k.x));
  k.y=Math.max(20,Math.min(H-20,k.y));

  // Off-track friction
  const [dist,offDist]=getTrackT(k.x,k.y);
  if(offDist>TRACK_W) k.speed*=OFFTRACK_FRICTION;

  // Lap counting
  const prevDist=k.lastDist;
  k.lastDist=k.trackDist;
  k.trackDist=dist;
  // Detect finish line (near 0/TOTAL_LEN)
  if(prevDist>TOTAL_LEN*0.9&&dist<TOTAL_LEN*0.1){
    k.lap++; if(k.lap>=LAPS) k.finished=true;
    if(isPlayer&&k.lap<LAPS) spawnParticles(k.x,k.y,'#fbbf24',16);
  }
}

// ── ITEMS ──
function useItem(k){
  if(!k.item||k.itemCool>0) return;
  k.itemCool=60;
  if(k.item==='mushroom'){
    k.boosting=40; k.item=null;
    spawnParticles(k.x,k.y,'#f97316',8);
  } else if(k.item==='banana'){
    bananas.push({x:k.x,y:k.y,r:8});
    k.item=null;
  } else if(k.item==='shell'){
    const angle=k.angle;
    shells.push({x:k.x,y:k.y,vx:Math.cos(angle)*8,vy:Math.sin(angle)*8,life:120});
    k.item=null;
    spawnParticles(k.x,k.y,'#38bdf8',6);
  }
}

function updateItems(){
  // Item boxes respawn
  itemBoxes.forEach(b=>{
    if(!b.active){ b.respawn--; if(b.respawn<=0) b.active=true; }
  });

  // Bananas & shells vs karts
  bananas=bananas.filter(bn=>{
    for(const k of karts){
      if(k.spinTimer>0||k.finished) continue;
      if(Math.hypot(k.x-bn.x,k.y-bn.y)<14){
        k.spinTimer=60; spawnParticles(bn.x,bn.y,'#facc15',8); return false;
      }
    }
    return true;
  });

  shells=shells.filter(sh=>{
    sh.x+=sh.vx; sh.y+=sh.vy; sh.life--;
    const [,od]=getTrackT(sh.x,sh.y);
    if(od>TRACK_W*1.4||sh.life<=0) return false;
    for(const k of karts){
      if(k.spinTimer>0||k.finished) continue;
      if(Math.hypot(k.x-sh.x,k.y-sh.y)<16){
        k.spinTimer=90; spawnParticles(sh.x,sh.y,'#38bdf8',10); return false;
      }
    }
    return true;
  });

  // Pick up item boxes
  karts.forEach(k=>{
    if(k.finished) return;
    itemBoxes.forEach(b=>{
      if(!b.active) return;
      if(Math.hypot(k.x-b.x,k.y-b.y)<20){
        b.active=false; b.respawn=300;
        if(!k.item){
          const items=['mushroom','mushroom','banana','shell'];
          k.item=items[Math.floor(Math.random()*items.length)];
          spawnParticles(k.x,k.y,'#a78bfa',10);
          if(k.id===0) spawnParticles(k.x,k.y,'#fbbf24',6);
        }
      }
    });
  });

  // AI uses items automatically
  karts.slice(1).forEach(k=>{
    if(k.item&&k.itemCool===0&&Math.random()<0.01) useItem(k);
    if(k.itemCool>0) k.itemCool--;
  });
  if(karts[0].itemCool>0) karts[0].itemCool--;
}

function updatePlaces(){
  // Sort by laps desc, then trackDist desc
  const ranked=[...karts].sort((a,b)=>{
    if(b.lap!==a.lap) return b.lap-a.lap;
    // Compare dist considering wrap
    const da=a.trackDist, db=b.trackDist;
    return db-da;
  });
  ranked.forEach((k,i)=>k.place=i+1);
}

// ── PARTICLES ──
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,col,r:3+Math.random()*3,life:30+Math.random()*20});
  }
}

// ── UPDATE ──
function update(){
  frameT++;
  if(countdown>0){
    if(frameT%60===0){ countdown--; }
    return;
  }
  raceTimer++;

  karts.forEach((k,i)=>updateKart(k, i===0));

  // Player item use
  if(keys[' ']&&karts[0].itemCool===0) useItem(karts[0]);

  updateItems();
  updatePlaces();

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life--; });

  // Race done?
  if(karts[0].finished&&scene==='game') setTimeout(()=>scene='finish',1000);
}

// ── DRAW TRACK ──
function drawTrack(){
  // Grass background
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#166534'); g.addColorStop(1,'#14532d');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Track (wide gray path)
  ctx.strokeStyle='#9ca3af'; ctx.lineWidth=TRACK_W*2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(TRACK_PTS[0][0],TRACK_PTS[0][1]);
  for(let i=1;i<TRACK_PTS.length;i++) ctx.lineTo(TRACK_PTS[i][0],TRACK_PTS[i][1]);
  ctx.stroke();

  // Track border (outer)
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=TRACK_W*2+10;
  ctx.beginPath(); ctx.moveTo(TRACK_PTS[0][0],TRACK_PTS[0][1]);
  for(let i=1;i<TRACK_PTS.length;i++) ctx.lineTo(TRACK_PTS[i][0],TRACK_PTS[i][1]);
  ctx.stroke();

  // Track road (gray)
  ctx.strokeStyle='#6b7280'; ctx.lineWidth=TRACK_W*2;
  ctx.beginPath(); ctx.moveTo(TRACK_PTS[0][0],TRACK_PTS[0][1]);
  for(let i=1;i<TRACK_PTS.length;i++) ctx.lineTo(TRACK_PTS[i][0],TRACK_PTS[i][1]);
  ctx.stroke();

  // Dashed center line
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2;
  ctx.setLineDash([18,14]);
  ctx.beginPath(); ctx.moveTo(TRACK_PTS[0][0],TRACK_PTS[0][1]);
  for(let i=1;i<TRACK_PTS.length;i++) ctx.lineTo(TRACK_PTS[i][0],TRACK_PTS[i][1]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Start/finish line
  const [fx,fy,fa]=getTrackPos(20);
  const nx=Math.cos(fa+Math.PI/2), ny=Math.sin(fa+Math.PI/2);
  for(let i=-3;i<4;i++){
    ctx.fillStyle=(i%2===0)?'#fff':'#000';
    ctx.fillRect(fx+nx*i*8-3,fy+ny*i*8-3,8,8);
  }
  // "START" text
  ctx.fillStyle='#fff'; ctx.font='bold 10px Segoe UI'; ctx.textAlign='center';
  ctx.fillText('START',fx,fy-18);

  // Item boxes
  itemBoxes.forEach(b=>{
    if(!b.active) return;
    const pulse=Math.sin(frameT*0.1)*3;
    ctx.shadowColor='#a78bfa'; ctx.shadowBlur=12;
    ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(b.x-12,b.y-12+pulse,24,24,4); ctx.stroke();
    ctx.fillStyle='rgba(167,139,250,0.2)'; ctx.beginPath(); ctx.roundRect(b.x-12,b.y-12+pulse,24,24,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 14px serif'; ctx.textAlign='center';
    ctx.fillText('?',b.x,b.y+6+pulse);
    ctx.shadowBlur=0;
  });

  // Bananas
  bananas.forEach(bn=>{
    ctx.font='16px serif'; ctx.textAlign='center'; ctx.fillText('🍌',bn.x,bn.y+5);
  });

  // Shells
  shells.forEach(sh=>{
    ctx.fillStyle='#38bdf8'; ctx.shadowColor='#38bdf8'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(sh.x,sh.y,8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });
}

// ── DRAW KART ──
function drawKart(k){
  ctx.save();
  ctx.translate(k.x,k.y);
  ctx.rotate(k.angle+Math.PI/2);
  const w=k.w, h=k.h;
  const col=KART_COLORS[k.id];

  if(k.spinTimer>0) ctx.globalAlpha=Math.floor(frameT/3)%2?0.4:1;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2,2,w*0.55,h*0.4,0,0,Math.PI*2); ctx.fill();

  // Kart body
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.roundRect(-w/2,-h*0.55,w,h,5); ctx.fill();

  // Windshield
  ctx.fillStyle='rgba(200,240,255,0.7)';
  ctx.beginPath(); ctx.roundRect(-w*0.35,-h*0.5,w*0.7,h*0.3,3); ctx.fill();

  // Front accent
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(-w/2,-h*0.55,w,4);

  // Wheels (4 corners)
  ctx.fillStyle='#1f2937';
  [[-w*0.5,-h*0.4],[w*0.5,-h*0.4],[-w*0.5,h*0.3],[w*0.5,h*0.3]].forEach(([wx,wy])=>{
    ctx.beginPath(); ctx.ellipse(wx,wy,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#6b7280'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(wx,wy,3,5,0,0,Math.PI*2); ctx.stroke();
  });

  // Kart number
  ctx.fillStyle='#fff'; ctx.font='bold 9px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(KART_NAMES[k.id][0],0,-h*0.1);

  ctx.globalAlpha=1;
  ctx.restore();

  // Item held
  if(k.id===0&&k.item){
    const icons={'mushroom':'🍄','banana':'🍌','shell':'🐚'};
    ctx.font='14px serif'; ctx.textAlign='center';
    ctx.fillText(icons[k.item]||'?',k.x,k.y-22);
  }
}

// ── HUD ──
function drawHUD(){
  const pl=karts[0];

  // Top bar
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,40);

  // Place
  const placeStr=['1.','2.','3.','4.'][pl.place-1]||`${pl.place}.`;
  const placeCol=pl.place===1?'#fbbf24':pl.place===2?'#d1d5db':'#cd7c2f';
  ctx.fillStyle=placeCol; ctx.font='bold 22px Segoe UI'; ctx.textAlign='left';
  ctx.fillText(`${placeStr} Platz`,10,28);

  // Laps
  ctx.fillStyle='#fff'; ctx.font='bold 16px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(`Runde ${Math.min(pl.lap+1,LAPS)} / ${LAPS}`,W/2,26);

  // Speed bar
  const spd=Math.abs(pl.speed);
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(W-120,8,110,14,7); ctx.fill();
  if(spd>0){
    const sg=ctx.createLinearGradient(W-120,0,W-10,0);
    sg.addColorStop(0,'#22c55e'); sg.addColorStop(0.7,'#f59e0b'); sg.addColorStop(1,'#ef4444');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.roundRect(W-120,8,110*(spd/MAX_SPEED),14,7); ctx.fill();
  }
  ctx.fillStyle='#fff'; ctx.font='bold 10px Segoe UI'; ctx.textAlign='right';
  ctx.fillText(`${Math.round(spd/MAX_SPEED*200)} km/h`,W-6,28);

  // Timer
  const secs=Math.floor(raceTimer/60), ms=Math.floor((raceTimer%60)*100/60);
  ctx.fillStyle='#94a3b8'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
  ctx.fillText(`⏱ ${secs}:${ms.toString().padStart(2,'0')}`,10,H-8);

  // Item held (bottom center)
  if(pl.item){
    const icons={'mushroom':'🍄','banana':'🍌','shell':'🐚'};
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(W/2-24,H-48,48,40,8); ctx.fill();
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(W/2-24,H-48,48,40,8); ctx.stroke();
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.fillText(icons[pl.item]||'?',W/2,H-16);
  }

  // Countdown
  if(countdown>0){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=30;
    ctx.font='bold 100px Segoe UI'; ctx.fillStyle='#fbbf24';
    ctx.fillText(countdown>0?countdown:'GO!',W/2,H/2+30);
    ctx.shadowBlur=0;
  }

  // Mini-map (bottom right)
  const mx=W-90, my=H-90, mw=80, mh=72, scx=mw/700, scy=mh/460;
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(mx-4,my-4,mw+8,mh+8,6); ctx.fill();
  // Mini track
  ctx.strokeStyle='rgba(150,150,150,0.7)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(mx+TRACK_PTS[0][0]*scx,my+TRACK_PTS[0][1]*scy);
  for(let i=1;i<TRACK_PTS.length;i++) ctx.lineTo(mx+TRACK_PTS[i][0]*scx,my+TRACK_PTS[i][1]*scy);
  ctx.stroke();
  // Kart dots
  karts.forEach(k=>{
    ctx.fillStyle=KART_COLORS[k.id];
    ctx.beginPath(); ctx.arc(mx+k.x*scx,my+k.y*scy,k.id===0?4:3,0,Math.PI*2); ctx.fill();
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/50; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── SCREENS ──
function drawMenu(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f172a'); g.addColorStop(1,'#1a0a00');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Stars
  for(let i=0;i<40;i++){
    ctx.fillStyle=`rgba(255,255,255,${0.2+Math.sin(frameT*0.04+i)*0.15})`;
    ctx.beginPath(); ctx.arc((i*173)%W,(i*113)%H,1.5,0,Math.PI*2); ctx.fill();
  }
  ctx.textAlign='center';
  ctx.font='52px Segoe UI'; ctx.fillText('🏎️',W/2,95);
  ctx.font='bold 28px Segoe UI';
  const tg=ctx.createLinearGradient(W/2-160,0,W/2+160,0);
  tg.addColorStop(0,'#f59e0b'); tg.addColorStop(0.5,'#ef4444'); tg.addColorStop(1,'#8b5cf6');
  ctx.fillStyle=tg; ctx.fillText("Noah's Mario Kart",W/2,145);

  // Kart previews
  KART_COLORS.forEach((col,i)=>{
    const x=130+i*120, y=220;
    ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(x-22,y-12,44,28,6); ctx.fill();
    ctx.fillStyle='rgba(200,240,255,0.7)'; ctx.beginPath(); ctx.roundRect(x-14,y-10,28,12,3); ctx.fill();
    ctx.fillStyle='#1f2937';
    [[-18,-4],[18,-4],[-18,12],[18,12]].forEach(([wx,wy])=>{ctx.beginPath(); ctx.ellipse(x+wx,y+wy,5,7,0,0,Math.PI*2); ctx.fill();});
    ctx.fillStyle=col==='#3b82f6'?'#fff':'#fff'; ctx.font='bold 11px Segoe UI';
    ctx.fillText(KART_NAMES[i],x,y+36);
  });
  ctx.fillStyle='rgba(59,130,246,0.3)'; ctx.beginPath(); ctx.roundRect(68,190,116,62,8); ctx.fill();
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(68,190,116,62,8); ctx.stroke();
  ctx.fillStyle='#3b82f6'; ctx.font='bold 10px Segoe UI'; ctx.fillText('← Du',130,270);

  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.roundRect(W/2-230,300,460,60,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='14px Segoe UI';
  ctx.fillText('↑/W = Gas  ·  ↓/S = Bremsen  ·  ←→/AD = Lenken  ·  Leertaste = Item',W/2,326);
  ctx.fillStyle='#94a3b8'; ctx.font='12px Segoe UI';
  ctx.fillText(`${LAPS} Runden · Items sammeln · Gegner abschießen!`,W/2,350);

  const pulse=Math.sin(frameT*0.07)*5;
  ctx.fillStyle='rgba(245,158,11,0.15)'; ctx.beginPath(); ctx.roundRect(W/2-130,378+pulse,260,52,14); ctx.fill();
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.roundRect(W/2-130,378+pulse,260,52,14); ctx.stroke();
  ctx.font='bold 18px Segoe UI'; ctx.fillStyle='#f59e0b';
  ctx.fillText('🏁 Rennen starten!',W/2,411+pulse);

  cv.onclick=()=>{ initRace(); scene='game'; cv.onclick=null; };
}

function drawFinish(){
  const pl=karts[0];
  ctx.fillStyle='rgba(0,0,10,0.88)'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    const x=(i*137+frameT*2)%W, y=((i*97+frameT)%H);
    ctx.fillStyle=['#f59e0b','#ef4444','#8b5cf6','#4ade80','#38bdf8'][i%5];
    ctx.beginPath(); ctx.arc(x,y,2+Math.sin(i)*1.5,0,Math.PI*2); ctx.fill();
  }
  ctx.textAlign='center';
  const win=pl.place===1;
  ctx.font='60px Segoe UI'; ctx.fillText(win?'🏆':'🏁',W/2,105);
  ctx.font='bold 26px Segoe UI';
  const tg=ctx.createLinearGradient(W/2-150,0,W/2+150,0);
  tg.addColorStop(0,'#f59e0b'); tg.addColorStop(1,win?'#4ade80':'#8b5cf6');
  ctx.fillStyle=tg;
  ctx.fillText(win?'Noah gewinnt! 🎉':`${pl.place}. Platz – gut gemacht!`,W/2,160);
  const secs=Math.floor(raceTimer/60), ms=Math.floor((raceTimer%60)*100/60);
  ctx.font='16px Segoe UI'; ctx.fillStyle='#94a3b8';
  ctx.fillText(`Zeit: ${secs}:${ms.toString().padStart(2,'0')}`,W/2,196);
  // Podium
  const ranked=[...karts].sort((a,b)=>a.place-b.place);
  ranked.forEach((k,i)=>{
    const px=W/2-150+i*100;
    ctx.fillStyle=KART_COLORS[k.id]; ctx.font='bold 14px Segoe UI';
    ctx.fillText(`${i+1}. ${KART_NAMES[k.id]}`,px,240);
  });
  const pulse=Math.sin(frameT*0.07)*4;
  ctx.fillStyle='rgba(245,158,11,0.15)'; ctx.beginPath(); ctx.roundRect(W/2-120,290+pulse,240,50,14); ctx.fill();
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(W/2-120,290+pulse,240,50,14); ctx.stroke();
  ctx.font='bold 15px Segoe UI'; ctx.fillStyle='#f59e0b';
  ctx.fillText('🔄 Nochmal fahren',W/2,321+pulse);
  cv.onclick=()=>{ scene='menu'; cv.onclick=null; };
}

// ── MAIN LOOP ──
function loop(){
  requestAnimationFrame(loop);
  frameT++;
  ctx.clearRect(0,0,W,H);
  if(scene==='menu')  drawMenu();
  else if(scene==='game'){ update(); drawTrack(); karts.forEach(k=>drawKart(k)); drawHUD(); }
  else if(scene==='finish') { drawTrack(); karts.forEach(k=>drawKart(k)); drawFinish(); }
}
loop();
</script>
